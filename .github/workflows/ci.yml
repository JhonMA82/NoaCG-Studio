# The same gates developers run locally, on every push: build, the full offline E2E suite,
# and the template factory checks. Playwright pins offline mode itself, so no secrets belong
# in this workflow. Live and authenticated flows remain maintainer-only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Node 24 (LTS) is the version the project is developed on, so npm validates the
      # lockfile exactly the way the machine that wrote it does.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + lint + bundle)
        run: npm run build

  e2e:
    name: E2E shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let every shard finish so one failure cannot hide another and all evidence reaches
      # the combined report.
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E shard
        run: npm run test:e2e -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload shard report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: error

      - name: Upload failure evidence
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  factory:
    name: Factory gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The factory needs a dev server. Its dedicated runner prevents a collision with the
      # offline-pinned Playwright servers, and the shell trap always cleans the process up.
      - name: Run factory gates
        run: |
          npm run dev &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          PORT="$(node scripts/dev-port.mjs)"
          READY=0
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${PORT}/app" > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Dev server did not become ready on port ${PORT}" >&2
            exit 1
          fi
          node scripts/factory.mjs --json factory-report.json

      - name: Upload factory report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-report
          path: factory-report.json
          retention-days: 7
          if-no-files-found: ignore

  e2e-report:
    name: Combined E2E report
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge shard reports
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload combined E2E report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

  gate:
    name: CI gate
    if: ${{ !cancelled() }}
    needs: [build, e2e, factory, e2e-report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A stable final check is easier to protect than four generated matrix-job names.
      - name: Require every gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          FACTORY_RESULT: ${{ needs.factory.result }}
          REPORT_RESULT: ${{ needs.e2e-report.result }}
        run: |
          test "$BUILD_RESULT" = "success"
          test "$E2E_RESULT" = "success"
          test "$FACTORY_RESULT" = "success"
          test "$REPORT_RESULT" = "success"
