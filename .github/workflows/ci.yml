# The per-change tier of the test pyramid: build, the factory checks, and the offline E2E specs
# that COVER THIS CHANGE - not the whole suite. The full suite runs nightly (nightly.yml), which
# is where exhaustive sweeps belong; here the question is "did this change break something", and
# the answer arrives in minutes on the commit that caused it.
#
# The cheap gates never tier. Build (typecheck + lint + bundle) runs on every change at ~70 s and
# is what catches the class of fault that once broke production for a week, so it is not
# something the plan is allowed to skip.
#
# Scoping is only ever safe because scripts/e2e-affected.mjs fails TOWARD running more: an
# unmapped file, a shared-core file, or an unusable diff base all escalate to the full suite.
# Playwright pins offline mode itself, so no secrets belong in this workflow. Live and
# authenticated flows remain maintainer-only.
name: CI

# Every branch, not only main. The gate here is STRICTER than anything a laptop runs before a
# merge (build + the sharded affected suite + the factory gates + the catalog tripwire, on a
# clean checkout) and it costs nothing: this repo is public, so Actions minutes are free and
# unmetered. Before this, a branch push triggered nothing at all, so the entire verification
# burden fell on the developer's machine - measured at 59 concurrent browser shells and 35 MB
# of free RAM on a 16 GB laptop, for an answer GitHub produces in six to nine minutes on
# hardware nobody is trying to work on.
#
# `'**'` is branches only, never tags. A same-repo pull request therefore gets two runs (one for
# the branch push, one for the PR); that is accepted rather than worked around, because the
# alternatives all mean per-job `if:` conditions that make the gate harder to read than a
# duplicate run is to ignore. `pull_request` stays because a FORK's branch never pushes here.
on:
  push:
    branches: ['**']
  pull_request:
  # The manual door, for when the automatic ones are shut. On 2026-08-06 an Actions incident
  # throttled webhook delivery to ~15%, so pushes stopped producing runs at all - and with only
  # push and pull_request triggers there was no way to ask for one. A dispatched run has no
  # `github.event.before`, so the plan below finds no diff base and escalates to the FULL suite,
  # which is the right answer for a run someone asked for by hand. Note GitHub only offers the
  # button once this trigger exists on the DEFAULT branch - it cannot rescue the outage it was
  # written during, only the next one.
  workflow_dispatch:

# Superseded runs cancel on branches and PRs, but never on main: a landed commit must keep
# its verdict (cancelled main runs left commits with NO CI answer while they were already
# deployed to production). Within the main group, newer pushes queue; GitHub keeps only the
# newest queued run, so main's HEAD always ends with a completed run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Node 24 (LTS) is the version the project is developed on, so npm validates the
      # lockfile exactly the way the machine that wrote it does.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + lint + bundle)
        run: npm run build

  # Did Vercel even accept this commit? On main only, and deliberately outside the gate below.
  #
  # Vercel validates vercel.json and the function budget BEFORE it creates a deployment, so a
  # refusal produces no build, no deployment row and no deployment_status event - nothing but a
  # `Vercel` commit status here on GitHub. On 2026-08-07 that froze production for eight commits
  # while every gate stayed green, and the only thing that eventually noticed was deploy-verify's
  # drift belt, hours later (docs/DEPLOYMENT.md). The status arrives within a minute of the push,
  # so asking for it here turns hours into minutes at the cost of one cheap job.
  #
  # The two local gates (check-vercel-config, check-function-budget) are what should catch this
  # before a push; this is the belt for the classes they cannot know about - a plan limit that
  # changed, a project setting, anything Vercel decides on its side.
  deployable:
    name: Vercel accepted the commit
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Wait for Vercel's verdict on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Poll rather than assume: the status is usually up within a minute, but a queued
          # deployment can take longer, and "no status yet" must never read as a refusal.
          #
          # The list endpoint, not the combined one: it is documented as reverse chronological,
          # so element 0 is the CURRENT verdict. Vercel posts pending first and then the result,
          # and reading the wrong one of those would either alarm early or miss the refusal.
          for i in $(seq 1 20); do
            # `|| true`: the step runs under `bash -e`, and a transient API failure must not be
            # reported as Vercel refusing the commit. No answer simply means keep waiting.
            VERDICT="$(gh api "repos/$GH_REPO/commits/$SHA/statuses" \
              --jq '[.[] | select(.context == "Vercel")][0] | "\(.state) \(.description) \(.target_url)"' || true)"
            STATE="${VERDICT%% *}"
            case "$STATE" in
              failure|error)
                echo "::error title=Vercel refused this commit::${VERDICT#* }"
                echo "No deployment exists for it, so the Vercel dashboard shows nothing at all."
                echo "Reproduce locally: npm run check:vercel-config && npm run check:function-budget"
                exit 1
                ;;
              success)
                echo "Vercel accepted $SHA."
                exit 0
                ;;
            esac
            sleep 15
          done
          # Vercel is under no obligation to answer on our schedule, and a missing verdict is not
          # a refusal. deploy-verify's drift belt is what catches a deployment that never happens.
          echo "No Vercel verdict for $SHA within five minutes - leaving it to deploy-verify."

  # What can this change actually have broken? The answer decides both which specs run and how
  # many runners they are worth. It needs no dependencies - scripts/e2e-affected.mjs is node
  # builtins and git - so this job costs seconds, and every other E2E job waits on it.
  plan:
    name: E2E plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      specs: ${{ steps.plan.outputs.specs }}
      catalog: ${{ steps.plan.outputs.catalog }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The plan IS a diff, so the default shallow clone has nothing to diff against.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Work out what this change can affect
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          # Student-release sprint (docs/GOALS.md "Student release"): a would-be FULL
          # escalation runs the focus set instead; the nightly still runs everything.
          # Delete this line when the sprint ends (scripts/e2e-lists.mjs says what else goes).
          # It deliberately does not apply to main - see the main branch below.
          E2E_SPRINT_FOCUS: '1'
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; else BASE="$PUSH_BEFORE"; fi
          # MAIN RUNS EVERYTHING. Every other run tests what THIS change can affect, which is
          # the right economics for a branch and the wrong one for the branch production ships
          # from: a spec no change maps to is never selected, so it can break and stay green
          # for as long as nobody escalates. That is not hypothetical - on 2026-08-07
          # e2e/public-service.spec.ts was red on main through eight consecutive green main
          # runs, and what finally surfaced it was an unrelated branch touching package.json
          # and escalating to the full suite by accident.
          #
          # The nightly already runs everything, so this buys LATENCY, not coverage: minutes
          # instead of up to a day, on the branch where a regression is already live. It costs
          # about two minutes of wall clock (the eight shards run in parallel) and no money -
          # the repo is public. The sprint's focus collapse is skipped here on purpose; focus
          # is a device for keeping BRANCH runs cheap, and main is where the paused areas are
          # supposed to be watched.
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "::notice title=E2E plan::main - running the FULL suite regardless of the diff."
            PLAN='{"mode":"full","specs":[],"catalog":true}'
          # An absent, all-zero (first push of a branch) or garbage-collected base means we
          # cannot know what changed. Then we do not guess: the fallback is the whole suite,
          # because the one thing a fallback must never do is run LESS than the truth.
          elif [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice title=E2E plan::No usable diff base ('${BASE}') - running the FULL suite."
            PLAN='{"mode":"full","specs":[],"catalog":true}'
          else
            PLAN="$(node scripts/e2e-affected.mjs --json "$BASE")"
          fi
          echo "plan: $PLAN"
          # Shard count follows the size of the plan. Full runs get nine; a subset gets one
          # runner per ~4 spec files, capped at four - beyond that the 52 s of per-shard setup
          # costs more than it saves. The floor of 1 also keeps every shard non-empty:
          # a shard with no tests writes no blob report, and the upload below treats a missing
          # report as an error rather than silently reporting on less than was run.
          node -e '
            const plan = JSON.parse(process.argv[1]);
            const shards = plan.mode === "full" ? 9 : Math.min(4, Math.max(1, Math.floor(plan.specs.length / 4)));
            console.log([
              `mode=${plan.mode}`,
              `specs=${plan.specs.join(" ")}`,
              `catalog=${plan.catalog}`,
              `matrix=${JSON.stringify({ shardIndex: Array.from({ length: shards }, (_, i) => i + 1), shardTotal: [shards] })}`,
            ].join("\n"));
          ' "$PLAN" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E ${{ matrix.shardIndex }}/${{ matrix.shardTotal }} (${{ needs.plan.outputs.mode }})
    needs: plan
    # 'none' means the change cannot reach the offline E2E surface at all (docs, a workflow's
    # own prose, a script the app never loads). Skipping is the plan being believed, not the
    # gate being weakened - anything it is unsure about became 'full' upstream.
    if: ${{ needs.plan.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let every shard finish so one failure cannot hide another and all evidence reaches
      # the combined report.
      fail-fast: false
      # Sized by the plan job, not fixed here. A full run gets nine shards: wall time is
      # fixed-cost + test-time/shards, and on run 30539377062 a shard spent 52 s on setup
      # (checkout, npm ci, the browser, and a 7 s dev-server boot) against 12.8 min of tests -
      # so ~94% of the clock is the part sharding divides, and 13.6 min becomes ~7.
      #
      # Nine and not twelve, even though the arithmetic keeps improving: every shard is an
      # independent runner doing its own checkout and install, so the chance that ONE of them
      # hits an infrastructure hiccup grows with the count, and with retries: 0 and
      # fail-fast: false a single hiccup reds the whole gate. Nine takes most of the win for
      # a fraction of the added surface, and leaves room under the 20-concurrent-job ceiling
      # for an overlapping PR run.
      #
      # THE NINTH SHARD IS HEADROOM, NOT SPEED, and it is the right lever: Playwright shards
      # by spec FILE, not by measured time, so the spread is what matters. On run 32178282707
      # (full, green) the eight shards ran 7.4 / 8.6 / 8.7 / 9.5 / 9.7 / 10.9 / 13.1 / 14.2
      # min - a slowest shard at 71% of the 20-minute budget, entirely from an unlucky split
      # rather than from anything being wrong. A ninth shard pulls that back to ~12.4 min
      # (62%). Raising timeout-minutes was the tempting alternative and is refused on purpose:
      # a loose budget makes the timeout stop distinguishing a genuinely hung shard from a
      # busy one, which is the whole reason the limit exists. Keep it at 20 and add capacity.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the browser binary rather than pulling ~170 MB from the Playwright CDN once
      # per shard. Keyed on Playwright's own version (read after install, so it is the
      # resolved one) instead of the lockfile hash: an unrelated dependency bump must not
      # throw away a browser that did not change.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser, never the runner's system libraries - those come with
      # the image and must still be reconciled on a cache hit.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E shard
        env:
          SPECS: ${{ needs.plan.outputs.specs }}
        # $SPECS is deliberately unquoted: it is a space-separated list of spec filenames from
        # the curated map, and word splitting is what turns it into separate Playwright
        # filters. An EMPTY list means no filter, i.e. the whole suite - which is precisely
        # what mode 'full' asks for, and why mode 'none' must skip this job rather than reach
        # it with nothing to run.
        run: npm run test:e2e -- $SPECS --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload shard report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: error

      - name: Upload failure evidence
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The catalog calibration tripwire benches every variant, so it is far too heavy to run on
  # every change - but a pack merge is exactly when it earns its cost, and waiting for the
  # nightly would let a broken variant sit in main all day. The plan raises this flag only for
  # changes that can move catalog output or the bench itself, so most merges never see it.
  e2e-catalog:
    name: Catalog calibration gate
    needs: plan
    if: ${{ needs.plan.outputs.catalog == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Catalog calibration tripwire
        run: npm run test:e2e:catalog

  factory:
    name: Factory gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The factory needs a dev server. Its dedicated runner prevents a collision with the
      # offline-pinned Playwright servers, and the shell trap always cleans the process up.
      - name: Run factory gates
        run: |
          npm run dev &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          PORT="$(node scripts/dev-port.mjs)"
          READY=0
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${PORT}/app" > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Dev server did not become ready on port ${PORT}" >&2
            exit 1
          fi
          node scripts/factory.mjs --json factory-report.json

      - name: Upload factory report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-report
          path: factory-report.json
          retention-days: 7
          if-no-files-found: ignore

  # CONVENIENCE, NOT A GATE. This job runs no test and asserts nothing about the code: it
  # stitches the shards' blob reports into one browsable HTML report. It is deliberately absent
  # from the `gate` job's `needs` below, and the reason is written there.
  e2e-report:
    name: Combined E2E report
    # Nothing to merge when the plan ran no specs: there are no blob reports, and the merge
    # would fail on an empty input rather than say "there was nothing to report".
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'none' }}
    needs: [plan, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout stays (it costs a couple of seconds and gives us the lockfile); the `npm ci`
      # that used to follow it does not. Merging blob reports needs exactly one package, so
      # installing this repository's entire dependency tree to reach it was ~40 s of work per
      # run for a job that tests nothing. The version is read from the lockfile rather than
      # from an installed tree, so the merger is exactly the Playwright the shards wrote those
      # blobs with - a mismatch there is the one way this step can fail for a real reason.
      # `setup-node` goes with it: the runner image's own Node is enough to parse one JSON file
      # and run one `npx`, and this job builds nothing that could depend on the version.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - name: Resolve the Playwright version from the lockfile
        id: playwright-version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "Merging with @playwright/test@${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download shard reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge shard reports
        run: npx --yes "@playwright/test@${{ steps.playwright-version.outputs.version }}" merge-reports --reporter=html ./all-blob-reports

      - name: Upload combined E2E report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

  gate:
    name: CI gate
    if: ${{ !cancelled() }}
    # `e2e-report` is deliberately NOT here. Everything else in this list runs the repository's
    # code and can therefore be wrong about it; the report job merges artifacts and runs no
    # test, so its failure says only that nobody gets a browsable HTML report. It adds no
    # coverage either: a shard that produced no blob report already fails IN THE SHARD, via
    # `if-no-files-found: error` on its upload, and the shards are required below.
    #
    # This is not a relaxation of the strictness below - that stands, and should. For a job
    # that tests code, "died on infrastructure" is genuinely indistinguishable from "found a
    # fault", so the doctrine is to fail toward noise. For a job that tests nothing, both
    # readings say the same thing about the commit: nothing at all. On 2026-08-06 a GitHub
    # Actions outage killed this job twice on `main` (runs 31113465980 and 31123645874) while
    # every code-testing job passed, and both times the gate went red and filed the rolling
    # red-main issue against a commit nothing was wrong with. A gate whose verdict can be
    # flipped by a job with no opinion about the code is reporting on the wrong thing.
    needs: [build, plan, e2e, e2e-catalog, factory]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # the main-branch failure steps file/close a rolling issue
    steps:
      # A stable final check is easier to protect than a set of generated matrix-job names.
      # Each failed gate is named as an error annotation, so a red run says WHICH job to
      # open instead of only being red.
      - name: Require every gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CATALOG_RESULT: ${{ needs.e2e-catalog.result }}
          FACTORY_RESULT: ${{ needs.factory.result }}
        run: |
          status=0
          fail() {
            echo "::error title=CI gate::$1 finished '$2' - open that job's log; the failing command and test names are annotated there."
            status=1
          }
          # Always runs, so anything but success is a fault. The plan belongs here: if it
          # cannot decide what to test, no downstream skip may be read as approval.
          require() {
            [ "$2" = "success" ] || fail "$1" "$2"
          }
          # Runs only when the plan asked for it. 'skipped' here is the plan being believed -
          # and the plan is itself required above, so a skip can never be covering for a
          # crashed planner.
          optional() {
            case "$2" in
              success|skipped) ;;
              *) fail "$1" "$2" ;;
            esac
          }
          require "Build (typecheck + lint + bundle)" "$BUILD_RESULT"
          require "E2E plan" "$PLAN_RESULT"
          require "Factory gates" "$FACTORY_RESULT"
          optional "E2E shards" "$E2E_RESULT"
          optional "Catalog calibration gate" "$CATALOG_RESULT"
          exit "$status"

      # Fail-loud on main, the weekly-audit pattern: ONE rolling issue, one comment per
      # newly red commit (re-runs of the same commit stay silent), closed by the next green.
      - name: File / update the red-main issue
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="CI is red on main"
          SHA="${{ github.sha }}"
          BODY="Commit ${SHA} failed CI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          elif gh issue view "$EXISTING" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' | grep -qF "$SHA"; then
            echo "Commit $SHA already reported on issue #$EXISTING."
          else
            gh issue comment "$EXISTING" --body "Still red. $BODY"
          fi

      - name: Close the red-main issue
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="CI is red on main"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Green again at ${{ github.sha }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
