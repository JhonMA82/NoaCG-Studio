# The same gates developers run locally, on every push: build, the full offline E2E suite,
# and the template factory checks. Playwright pins offline mode itself, so no secrets belong
# in this workflow. Live and authenticated flows remain maintainer-only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs cancel on branches and PRs, but never on main: a landed commit must keep
# its verdict (cancelled main runs left commits with NO CI answer while they were already
# deployed to production). Within the main group, newer pushes queue; GitHub keeps only the
# newest queued run, so main's HEAD always ends with a completed run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Node 24 (LTS) is the version the project is developed on, so npm validates the
      # lockfile exactly the way the machine that wrote it does.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + lint + bundle)
        run: npm run build

  e2e:
    name: E2E shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let every shard finish so one failure cannot hide another and all evidence reaches
      # the combined report.
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E shard
        run: npm run test:e2e -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload shard report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: error

      - name: Upload failure evidence
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  factory:
    name: Factory gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The factory needs a dev server. Its dedicated runner prevents a collision with the
      # offline-pinned Playwright servers, and the shell trap always cleans the process up.
      - name: Run factory gates
        run: |
          npm run dev &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          PORT="$(node scripts/dev-port.mjs)"
          READY=0
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${PORT}/app" > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Dev server did not become ready on port ${PORT}" >&2
            exit 1
          fi
          node scripts/factory.mjs --json factory-report.json

      - name: Upload factory report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-report
          path: factory-report.json
          retention-days: 7
          if-no-files-found: ignore

  e2e-report:
    name: Combined E2E report
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge shard reports
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload combined E2E report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

  gate:
    name: CI gate
    if: ${{ !cancelled() }}
    needs: [build, e2e, factory, e2e-report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # the main-branch failure steps file/close a rolling issue
    steps:
      # A stable final check is easier to protect than four generated matrix-job names.
      # Each failed gate is named as an error annotation, so a red run says WHICH job to
      # open instead of only being red.
      - name: Require every gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          FACTORY_RESULT: ${{ needs.factory.result }}
          REPORT_RESULT: ${{ needs.e2e-report.result }}
        run: |
          status=0
          check() {
            if [ "$2" != "success" ]; then
              echo "::error title=CI gate::$1 finished '$2' - open that job's log; the failing command and test names are annotated there."
              status=1
            fi
          }
          check "Build (typecheck + lint + bundle)" "$BUILD_RESULT"
          check "E2E shards" "$E2E_RESULT"
          check "Factory gates" "$FACTORY_RESULT"
          check "Combined E2E report" "$REPORT_RESULT"
          exit "$status"

      # Fail-loud on main, the weekly-audit pattern: ONE rolling issue, one comment per
      # newly red commit (re-runs of the same commit stay silent), closed by the next green.
      - name: File / update the red-main issue
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="CI is red on main"
          SHA="${{ github.sha }}"
          BODY="Commit ${SHA} failed CI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          elif gh issue view "$EXISTING" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' | grep -qF "$SHA"; then
            echo "Commit $SHA already reported on issue #$EXISTING."
          else
            gh issue comment "$EXISTING" --body "Still red. $BODY"
          fi

      - name: Close the red-main issue
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="CI is red on main"
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Green again at ${{ github.sha }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
