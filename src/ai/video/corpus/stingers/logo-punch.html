<!doctype html>
<!-- ============================================================================
     LOGO PUNCH - the mark IS the transition.
     Hand-authored anchor for the NoaCG video corpus (docs/NOACG_VIDEO_PLAN.md §2.2/§2.4).

     Visual direction: the brand mark flies at the camera out of the live picture, and the
     field bursts out from behind it - so the cover is CAUSED by the logo rather than being a
     panel the logo happens to sit on. At the end the mark keeps coming, punches through the
     lens, and the field it brought breaks into three slabs that fly apart.

     This is the answer to the failure mode the other two directions have to work around: a
     surface that slides in and parks for the whole window is a slate. Here the covering
     surface is never at rest - it is born from the mark, held for the length of the window
     while the mark grows, and destroyed by the mark leaving.

     THE MARK IS NEVER ON A PLATE (§2.4). It is on the live picture, then on the brand's own
     field, and nothing frames it at any point.

     AND BEFORE THE COVER, THE MARK IS ALONE (§2.4 rule 4). The first version of this file ran
     an accent streak and an expanding accent ring over the live picture ahead of the burst;
     on review both read as a stray blue outline flying in around the logo - a defect, because
     a viewer has no way to tell decoration from an artifact when it is sitting on the feed.
     The streak is gone and the ring now starts at 0.48 s, inside the cut window.

     THE CONTRACT, and how this file keeps it:
       - 2.00 s at 1920x1080, transparent.
       - FRAME 0 IS EMPTY BY CONSTRUCTION: the field group is at scale 0 (a zero-area box
         paints nothing), and the mark is at scale 0.12 with zero opacity.
       - THE LAST FRAME IS EMPTY THE SAME WAY: the three slabs finish 2900 px off frame at
         1.92 s and the mark has faded to zero by 1.62 s. 1.92 rather than 2.00 because the
         renderer's last frame is t = (N-1)/fps - 1.960 s at 25 fps, 1.983 s at 60 fps.
       - FULL COVER 0.46 s -> 1.12 s (data-cut-start / data-cut-end). The three slabs are
         1980 px wide at left -30 and 380 px tall on a 360 px pitch from top -10, so they
         overlap each other by 20 px and overhang the frame on every side. The burst finishes
         at 0.44 s and the slabs do not start moving until 1.30 s.
       - NOTHING PARKS: the mark is still growing through the whole window and the ring is
         still expanding at 0.9 s.

     Operator numbers for an ATEM at this duration (Clip Duration = round(2.00 x fps)):
       25 fps -> 50 frames,  cut window frames 12-28,  Trigger Point 14
       30 fps -> 60 frames,  cut window frames 14-34,  Trigger Point 16
       50 fps -> 100 frames, cut window frames 23-56,  Trigger Point 25
       60 fps -> 120 frames, cut window frames 28-67,  Trigger Point 30
     ============================================================================ -->
<html lang="en" data-composition-variables='[
  {"id":"logo","type":"image","label":"Brand logo","default":"logo"},
  {"id":"label","type":"string","label":"Word","default":"MATCHDAY"},
  {"id":"kicker","type":"string","label":"Kicker","default":"ROUND 14"},
  {"id":"brandDeep","type":"color","label":"Field colour","default":"#0B1220"},
  {"id":"brandAccent","type":"color","label":"Accent colour","default":"#00E0B8"},
  {"id":"brandInk","type":"color","label":"Text colour","default":"#F2F5F8"}
]'>
<head>
<meta charset="UTF-8" />
<title>Logo punch stinger</title>
<style>
  body { margin: 0; }

  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
  }
  .clip { position: absolute; inset: 0; }

  /* The field the mark brings with it: three slabs that behave as one surface while the
     group is scaled, and as three pieces once they leave. background-color is opaque and
     carries the whole cover; the gradient only shades it. */
  #field { position: absolute; inset: 0; }
  .slab {
    position: absolute;
    left: -30px;
    width: 1980px;
    height: 380px;
    background-color: var(--brandDeep, #0B1220);
  }
  #slab-a { top: -10px;  background-image: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 100%); }
  #slab-b { top: 350px;  background-image: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(0,0,0,0.10) 100%); }
  #slab-c { top: 710px;  background-image: linear-gradient(180deg, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0.34) 100%); }

  /* The ring the burst throws off. It lives entirely INSIDE the cut window: an accent
     rectangle expanding over the live picture ahead of the field read as a stray blue outline
     around the mark - a defect, not a flourish (§2.4 rule 4: before the cover, the mark and
     nothing else). */
  #ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 760px;
    height: 320px;
    margin-left: -380px;
    margin-top: -160px;
    border: 4px solid var(--brandAccent, #00E0B8);
    border-radius: 12px;
  }

  #payload {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* The mark, on nothing at all - a fixed box with object-fit: contain, so a 7.5:1 lockup
     and a 1:1 monogram both land inside it without the slot knowing which it got. */
  #logo-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 620px;
    height: 240px;
  }
  #logo { max-width: 100%; max-height: 100%; object-fit: contain; }

  #words { display: flex; flex-direction: column; align-items: center; margin-top: 34px; }
  #label-mask { overflow: hidden; padding: 0.1em 0.14em; }
  #label {
    font-size: 66px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    text-transform: uppercase;
    color: var(--brandInk, #F2F5F8);
  }
  #kicker {
    margin-top: 16px;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.46em;
    text-indent: 0.46em;
    text-transform: uppercase;
    color: var(--brandAccent, #00E0B8);
  }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0"
     data-width="1920" data-height="1080" data-duration="2"
     data-cut-start="0.46" data-cut-end="1.12">
  <section id="punch" class="clip" data-start="0" data-duration="2" data-track-index="1">
    <div id="field">
      <div id="slab-a" class="slab"></div>
      <div id="slab-b" class="slab"></div>
      <div id="slab-c" class="slab"></div>
    </div>
    <div id="ring"></div>
    <div id="payload">
      <div id="logo-slot"><img id="logo" data-var-src="logo" src="asset:logo" alt="" /></div>
      <div id="words">
        <div id="label-mask"><div id="label" data-var-text="label">MATCHDAY</div></div>
        <div id="kicker" data-var-text="kicker">ROUND 14</div>
      </div>
    </div>
  </section>
</div>
<script>
  // One paused timeline; every position below is an absolute composition second.
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // 0.00 -> 0.30  the MARK and nothing else comes out of the picture at the camera. Anything
  // else painting over the live feed here reads as an artifact, not as design.
  tl.fromTo('#logo-slot', { scale: 0.12, y: 190, autoAlpha: 0, rotation: -5 },
    { scale: 0.62, y: 0, autoAlpha: 1, rotation: 0, duration: 0.30, ease: 'power3.out' }, 0);

  // 0.22 -> 0.44  the field BURSTS out from behind the mark. This is the cover, and it is
  // the logo's move that produces it.
  tl.fromTo('#field', { scale: 0, transformOrigin: 'center center' },
    { scale: 1, duration: 0.22, ease: 'expo.out' }, 0.22);

  // 0.46 -> 1.12  FULL COVER. The mark keeps growing the whole way through, so the window is
  // a continuous push rather than a held frame.
  tl.to('#logo-slot', { scale: 1, duration: 0.44, ease: 'power3.out' }, 0.44);
  tl.to('#logo-slot', { scale: 1.1, duration: 0.62, ease: 'sine.in' }, 0.90);
  // The ring starts INSIDE the window - never over the live picture.
  tl.fromTo('#ring', { scale: 0.55, autoAlpha: 0, transformOrigin: 'center center' },
    { scale: 1.05, autoAlpha: 1, duration: 0.18, ease: 'expo.out' }, 0.48);
  tl.to('#ring', { scale: 2.6, autoAlpha: 0, duration: 0.66, ease: 'power2.out' }, 0.58);
  tl.fromTo('#label', { yPercent: 116 }, { yPercent: 0, duration: 0.44, ease: 'power4.out' }, 0.64);
  tl.fromTo('#label-mask', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.06, ease: 'none' }, 0.64);
  tl.fromTo('#kicker', { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.32, ease: 'power2.out' }, 0.82);

  // 1.16 -> 1.62  the punch: the mark accelerates through the lens and is gone.
  tl.to('#logo-slot', { scale: 8, autoAlpha: 0, duration: 0.46, ease: 'power3.in' }, 1.16);
  tl.to('#words', { scale: 1.6, autoAlpha: 0, duration: 0.34, ease: 'power2.in' }, 1.18);

  // 1.30 -> 1.92  the field it brought breaks apart behind it. The frame is still fully
  // covered well past the declared 1.12 end of the window, because power2.in starts at rest.
  tl.to('#slab-a', { x: -2900, duration: 0.60, ease: 'power2.in' }, 1.30);
  tl.to('#slab-b', { x: 2900, duration: 0.62, ease: 'power2.in' }, 1.30);
  tl.to('#slab-c', { x: -2900, duration: 0.58, ease: 'power2.in' }, 1.34);

  window.__timelines['main'] = tl;
</script>
</body>
</html>
