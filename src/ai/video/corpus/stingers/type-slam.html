<!doctype html>
<!-- ============================================================================
     TYPE SLAM - two-weight typography, the reference pack's signature.
     Hand-authored anchor for the NoaCG video corpus (docs/NOACG_VIDEO_PLAN.md §2.2/§2.4).

     Visual direction: a band of brand colour slams open from the frame's centre line until it
     fills, and the word arrives as ONE line in TWO weights - a heavy half and a light half,
     the same size, reading as a single phrase. A solid accent disc and an outline ring sit in
     the negative space either side of it, and two pairs of chevrons mark the travel direction.
     The band shuts the way it opened.

     WHY IT EXISTS: `benchmarks/video/v1/STINGER-REFERENCE-TEARDOWN.md` §3 item 5. Every card in
     the commercial "Typo Stinger" pack sets one heavy word against one light word at the same
     size; the corpus set everything in a single weight and looked plainer for it. It is also
     the seventh reveal shape - a horizontal opening from the centre line, where nothing else
     opens on that axis.

     THE TWO HALVES ARE THE TWO TEXT VARIABLES. `label` is the heavy half and `kicker` the
     light one, so a brand rewrites both halves of the phrase from the Content panel without
     the composition owning any words of its own.

     THE COVER COMES FIRST, THEN THE MARK (§2.4 rule 4); the mark sits on the brand's own field
     with NOTHING behind it (rule 1 - the disc and ring are deliberately clear of the lockup,
     because the first version put the disc behind the mark and Kestrel's volt wordmark on a
     volt disc disappeared outright); nothing rests inside the window (rule 2).

     THE CONTRACT, and how this file keeps it:
       - 2.00 s at 1920x1080, transparent.
       - FRAME 0 IS EMPTY BY CONSTRUCTION: the band is at scaleY 0, which paints nothing at all.
       - THE LAST FRAME IS EMPTY THE SAME WAY: the band is back to scaleY 0 at 1.90 s. 1.90
         rather than 2.00 because the renderer's last frame is t = (N-1)/fps - 1.960 s at 25 fps.
       - FULL COVER 0.46 s -> 1.12 s (data-cut-start / data-cut-end). The band is 1160 px tall
         against a 1080 px frame, so it covers from scaleY 0.932 upward, and it overhangs top
         and bottom by 40 px at rest. Everything else in the design sits inside it.

     Operator numbers for an ATEM at this duration (Clip Duration = round(2.00 x fps)):
       25 fps -> 50 frames,  cut window frames 12-28,  Trigger Point 14
       30 fps -> 60 frames,  cut window frames 14-34,  Trigger Point 16
       50 fps -> 100 frames, cut window frames 23-56,  Trigger Point 25
       60 fps -> 120 frames, cut window frames 28-67,  Trigger Point 30
     ============================================================================ -->
<html lang="en" data-composition-variables='[
  {"id":"logo","type":"image","label":"Brand logo","default":"logo"},
  {"id":"label","type":"string","label":"Word (heavy)","default":"NEXT"},
  {"id":"kicker","type":"string","label":"Word (light)","default":"UP"},
  {"id":"brandDeep","type":"color","label":"Band colour","default":"#101418"},
  {"id":"brandAccent","type":"color","label":"Accent colour","default":"#FF4D6D"},
  {"id":"brandInk","type":"color","label":"Text colour","default":"#F7F7F9"}
]'>
<head>
<meta charset="UTF-8" />
<title>Type slam stinger</title>
<style>
  body { margin: 0; }

  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  }
  .clip { position: absolute; inset: 0; }

  /* The covering surface: one band, taller than the frame, opening from its own centre line.
     background-color is opaque and carries the cover; the gradient only shades it. */
  #band {
    position: absolute;
    left: 0;
    top: -40px;
    width: 1920px;
    height: 1160px;
    background-color: var(--brandDeep, #101418);
    background-image: linear-gradient(180deg, rgba(128,128,128,0.20) 0%, rgba(128,128,128,0) 45%, rgba(0,0,0,0.28) 100%);
  }

  /* A solid accent disc in the negative space, CLEAR OF THE LOCKUP. It sat behind the mark in
     the first version and a brand whose ink is its accent colour - Kestrel's volt wordmark on
     a volt disc - vanished completely. A shape behind a mark is a plate whatever it is called
     (§2.4 rule 1), and the failure it causes is total rather than subtle. */
  #disc {
    position: absolute;
    left: 1478px;
    top: 74px;
    width: 372px;
    height: 372px;
    border-radius: 50%;
    background-color: var(--brandAccent, #FF4D6D);
  }
  /* Its counterweight, bottom left: an outline ring in the same accent. */
  #ring {
    position: absolute;
    left: 138px;
    top: 700px;
    width: 268px;
    height: 268px;
    border-radius: 50%;
    border: 10px solid var(--brandAccent, #FF4D6D);
    opacity: 0.5;
  }
  /* Chevrons: the pack's other signature, and they say which way the graphic is travelling. */
  /* The chevron's ROTATION lives on the inner element and its travel on the outer one.
     GSAP writes a whole transform, so animating x on the rotated box would flatten it. */
  .chev { position: absolute; top: 50%; width: 34px; height: 34px; margin-top: -17px; }
  .chev > i {
    display: block;
    width: 100%;
    height: 100%;
    border-right: 9px solid var(--brandAccent, #FF4D6D);
    border-bottom: 9px solid var(--brandAccent, #FF4D6D);
    transform: rotate(-45deg);
  }
  #chev-a { left: 168px; }
  #chev-b { left: 214px; }
  #chev-c { right: 214px; }
  #chev-d { right: 168px; }

  #lockup {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #logo-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 640px;
    height: 280px;
  }
  /* width/height 100% and NOT max-*: max-width only ever SHRINKS an image, so a mark whose
     SVG declares 120x120 renders at 120 px in a 300 px slot and the whole graphic reads as
     empty. object-fit: contain is what preserves the aspect once the box is the slot. */
  #logo { width: 100%; height: 100%; object-fit: contain; }

  /* THE TWO-WEIGHT LINE. Same size, same colour, one baseline: the contrast is weight alone,
     which is what makes it read as one phrase instead of a title plus a subtitle. */
  #phrase-mask { overflow: hidden; padding: 0.1em 0.12em; margin-top: 34px; }
  #phrase {
    display: flex;
    align-items: baseline;
    gap: 0.24em;
    font-size: 132px;
    line-height: 1.02;
    text-transform: uppercase;
    color: var(--brandInk, #F7F7F9);
  }
  #label { font-weight: 800; letter-spacing: -0.015em; }
  #kicker { font-weight: 300; letter-spacing: 0.02em; }

  #rule {
    width: 640px;
    height: 7px;
    margin-top: 34px;
    background-color: var(--brandAccent, #FF4D6D);
  }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0"
     data-width="1920" data-height="1080" data-duration="2"
     data-cut-start="0.46" data-cut-end="1.12">
  <section id="slam" class="clip" data-start="0" data-duration="2" data-track-index="1">
    <div id="band"></div>
    <div id="disc"></div>
    <div id="ring"></div>
    <div id="chev-a" class="chev"><i></i></div>
    <div id="chev-b" class="chev"><i></i></div>
    <div id="chev-c" class="chev"><i></i></div>
    <div id="chev-d" class="chev"><i></i></div>
    <div id="lockup">
      <div id="logo-slot"><img id="logo" data-var-src="logo" src="asset:logo" alt="" /></div>
      <div id="phrase-mask">
        <div id="phrase">
          <span id="label" data-var-text="label">NEXT</span><span id="kicker" data-var-text="kicker">UP</span>
        </div>
      </div>
      <div id="rule"></div>
    </div>
  </section>
</div>
<script>
  // One paused timeline; every position below is an absolute composition second.
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // 0.00 -> 0.36  the band slams open from the frame's centre line. Nothing else is on the
  // live picture while it does (§2.4 rule 4).
  tl.fromTo('#band', { scaleY: 0, transformOrigin: 'center center' },
    { scaleY: 1, duration: 0.36, ease: 'expo.out' }, 0);

  // 0.42 -> 1.12  FULL COVER. The disc lands, the mark drops onto its edge, the two-weight
  // line rises, the chevrons step in - the window is a build, not a held frame.
  tl.fromTo('#disc', { scale: 0, transformOrigin: 'center center' },
    { scale: 1, duration: 0.44, ease: 'back.out(1.4)' }, 0.42);
  tl.fromTo('#ring', { scale: 0, autoAlpha: 0, transformOrigin: 'center center' },
    { scale: 1, autoAlpha: 0.5, duration: 0.46, ease: 'back.out(1.2)' }, 0.50);
  tl.fromTo('#lockup', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.06, ease: 'none' }, 0.46);
  tl.from('#logo-slot', { y: 52, scale: 0.88, duration: 0.44, ease: 'power4.out' }, 0.46);
  tl.fromTo('#phrase', { yPercent: 116 }, { yPercent: 0, duration: 0.46, ease: 'power4.out' }, 0.62);
  tl.fromTo('#phrase-mask', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.06, ease: 'none' }, 0.62);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'center center' },
    { scaleX: 1, duration: 0.40, ease: 'power3.out' }, 0.76);
  tl.fromTo('.chev', { autoAlpha: 0, x: -26 },
    { autoAlpha: 1, x: 0, duration: 0.30, ease: 'power2.out', stagger: { each: 0.05, from: 'center' } }, 0.70);
  tl.to('#disc', { scale: 1.07, duration: 0.56, ease: 'sine.inOut' }, 0.94);
  tl.to('#ring', { rotation: 24, duration: 0.7, ease: 'none' }, 0.60);

  // 1.30 -> 1.90  the band shuts the way it opened, taking everything with it.
  tl.to('#lockup', { autoAlpha: 0, duration: 0.14, ease: 'power2.in' }, 1.30);
  tl.to('#disc', { scale: 0, duration: 0.30, ease: 'power2.in' }, 1.30);
  tl.to('#ring', { scale: 0, autoAlpha: 0, duration: 0.30, ease: 'power2.in' }, 1.34);
  tl.to('.chev', { autoAlpha: 0, duration: 0.14, ease: 'none' }, 1.30);
  tl.to('#band', { scaleY: 0, duration: 0.44, ease: 'power3.in' }, 1.46);

  window.__timelines['main'] = tl;
</script>
</body>
</html>
