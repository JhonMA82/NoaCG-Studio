<!doctype html>
<!-- ============================================================================
     APERTURE BANDS - the editorial / news stinger.
     Hand-authored anchor for the NoaCG video corpus (docs/NOACG_VIDEO_PLAN.md §2.2/§3).

     Visual direction: precise and editorial, the opposite of replay-slab. Eight vertical
     bands grow from alternating edges until the frame is closed, a light card holds the
     mark, a hairline rule draws under it, and the bands retract from the far side.

     THE CONTRACT, and how this file keeps it:
       - 2.00 s at 1920x1080, transparent.
       - FRAME 0 IS EMPTY BY CONSTRUCTION: every band starts at scaleY 0, which paints
         nothing at all, and the card starts at autoAlpha 0. There is no first frame with a
         sliver of band on it.
       - THE LAST FRAME IS EMPTY THE SAME WAY: the last band finishes retracting at 1.85 s,
         comfortably inside the renderer's last frame (t = (N-1)/fps, i.e. 1.960 s at 25 fps
         and 1.983 s at 60 fps).
       - FULL COVER 0.46 s -> 1.12 s (data-cut-start / data-cut-end). The bands are 242 px
         wide on a 240 px pitch and 1088 px tall on a -4 px top, so they OVERLAP each other
         by 2 px and overhang the frame top and bottom - a tiled cover has to be built with
         overlap or it ships a one-pixel seam the outgoing feed flashes through, and an
         average-alpha check would never see it. The last band lands at 0.444 s and the first
         one does not start leaving until 1.34 s, so both ends of the declared window have
         real margin.
       - The payload is a LOGO on a card whose surface is --brandPlate. This design's card is
         LIGHT by default, which makes it the right anchor for dark-ink marks (the Aldervale
         monogram, the Ledger slab) and the wrong one for light-ink marks unless the plate is
         darkened - which is the point of declaring the surface rather than assuming it.

     Operator numbers for an ATEM at this duration (Clip Duration = round(2.00 x fps)):
       25 fps -> 50 frames,  cut window frames 12-28,  Trigger Point 14
       30 fps -> 60 frames,  cut window frames 14-34,  Trigger Point 16
       50 fps -> 100 frames, cut window frames 23-56,  Trigger Point 25
       60 fps -> 120 frames, cut window frames 28-67,  Trigger Point 30
     ============================================================================ -->
<html lang="en" data-composition-variables='[
  {"id":"logo","type":"image","label":"Brand logo","default":"logo"},
  {"id":"label","type":"string","label":"Word","default":"THE REPORT"},
  {"id":"kicker","type":"string","label":"Kicker","default":"LIVE FROM THE NEWSROOM"},
  {"id":"brandDeep","type":"color","label":"Band colour","default":"#0E1A24"},
  {"id":"brandAccent","type":"color","label":"Accent colour","default":"#1F6FEB"},
  {"id":"brandInk","type":"color","label":"Text colour","default":"#16202B"},
  {"id":"brandPlate","type":"color","label":"Card surface","default":"#F4F6F8"}
]'>
<head>
<meta charset="UTF-8" />
<title>Aperture bands stinger</title>
<style>
  body { margin: 0; }

  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  .clip { position: absolute; inset: 0; }

  /* The eight bands. 242 px wide on a 240 px pitch is a deliberate 2 px overlap, and the
     -4 px top with 1088 px height overhangs the frame: a tiled cover built edge-to-edge
     leaves sub-pixel seams once the compositor rounds. */
  .band {
    position: absolute;
    top: -4px;
    width: 242px;
    height: 1088px;
    background-color: var(--brandDeep, #0E1A24);
  }
  /* Alternating bands carry a light wash, so the closed frame reads as a built surface
     rather than one flat fill - and the wash is derived from the brand colour, not a
     second colour the operator has to keep in sync. */
  .band:nth-child(even) {
    background-image: linear-gradient(rgba(255,255,255,0.055), rgba(255,255,255,0.055));
  }
  .band:nth-child(1) { left: -1px; }
  .band:nth-child(2) { left: 239px; }
  .band:nth-child(3) { left: 479px; }
  .band:nth-child(4) { left: 719px; }
  .band:nth-child(5) { left: 959px; }
  .band:nth-child(6) { left: 1199px; }
  .band:nth-child(7) { left: 1439px; }
  .band:nth-child(8) { left: 1679px; }

  #stage { display: flex; align-items: center; justify-content: center; }

  /* The rule sweeps the full width behind the card - the editorial equivalent of the sports
     light sweep, and the reason the covered stretch is never a still frame. */
  #rule {
    position: absolute;
    left: 0;
    top: 50%;
    width: 1920px;
    height: 4px;
    margin-top: 232px;
    background-color: var(--brandAccent, #1F6FEB);
  }

  #card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 54px 90px 46px;
    background-color: var(--brandPlate, #F4F6F8);
    box-shadow: 0 28px 90px rgba(0,0,0,0.38);
  }
  /* The fixed slot: object-fit: contain means a 7.5:1 lockup and a 1:1 monogram both land
     inside it without the slot knowing which mark it was given. */
  #logo-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 460px;
    height: 168px;
  }
  #logo { max-width: 100%; max-height: 100%; object-fit: contain; }

  #hairline {
    width: 460px;
    height: 2px;
    margin: 30px 0 24px;
    background-color: var(--brandAccent, #1F6FEB);
  }

  #label-mask { overflow: hidden; padding: 0.08em 0.1em; }
  #label {
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    font-size: 76px;
    font-weight: 700;
    line-height: 1.06;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--brandInk, #16202B);
  }
  #kicker {
    margin-top: 16px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--brandAccent, #1F6FEB);
  }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0"
     data-width="1920" data-height="1080" data-duration="2"
     data-cut-start="0.46" data-cut-end="1.12">
  <section id="bands" class="clip" data-start="0" data-duration="2" data-track-index="1">
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
  </section>
  <section id="stage" class="clip" data-start="0" data-duration="2" data-track-index="2">
    <div id="rule"></div>
    <div id="card">
      <div id="logo-slot"><img id="logo" data-var-src="logo" src="asset:logo" alt="" /></div>
      <div id="hairline"></div>
      <div id="label-mask"><div id="label" data-var-text="label">THE REPORT</div></div>
      <div id="kicker" data-var-text="kicker">LIVE FROM THE NEWSROOM</div>
    </div>
  </section>
</div>
<script>
  // One paused timeline; every position below is an absolute composition second.
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // Bands grow from alternating edges on the way in, and retract toward the OPPOSITE edge
  // on the way out. Swapping the origin at 1.34 is invisible because the band is at full
  // scale there - a full-scale element looks identical whatever its origin.
  const growFrom = (i) => (i % 2 === 0 ? 'center top' : 'center bottom');
  const leaveTo = (i) => (i % 2 === 0 ? 'center bottom' : 'center top');

  // 0.02 -> 0.444  the frame closes, left to right.
  tl.fromTo('.band',
    { scaleY: 0, transformOrigin: growFrom },
    { scaleY: 1, transformOrigin: growFrom, duration: 0.20, ease: 'power3.out',
      stagger: { each: 0.032, from: 'start' } },
    0.02);

  // 0.46 -> 1.12  FULL COVER. The card, the rule and the type all live inside the window.
  tl.fromTo('#card', { autoAlpha: 0, y: 28 }, { autoAlpha: 1, y: 0, duration: 0.30, ease: 'power3.out' }, 0.48);
  tl.from('#logo-slot', { autoAlpha: 0, y: 18, duration: 0.30, ease: 'power2.out' }, 0.56);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.50, ease: 'power2.inOut' }, 0.60);
  tl.from('#hairline', { scaleX: 0, transformOrigin: 'center center', duration: 0.28, ease: 'power2.out' }, 0.66);
  tl.from('#label', { yPercent: 112, duration: 0.42, ease: 'power4.out' }, 0.70);
  tl.from('#kicker', { autoAlpha: 0, duration: 0.28, ease: 'none' }, 0.88);
  tl.to('#card', { scale: 1.016, duration: 0.34, ease: 'sine.inOut' }, 0.96);

  // 1.22 -> 1.34  the card leaves first, so the bands are never seen cutting through it.
  tl.to('#card', { autoAlpha: 0, y: -20, duration: 0.12, ease: 'power2.in' }, 1.22);
  tl.to('#rule', { autoAlpha: 0, duration: 0.12, ease: 'none' }, 1.22);

  // 1.34 -> 1.85  the frame opens again, this time right to left.
  tl.to('.band', { scaleY: 0, transformOrigin: leaveTo, duration: 0.30, ease: 'power3.in',
    stagger: { each: 0.030, from: 'end' } }, 1.34);

  window.__timelines['main'] = tl;
</script>
</body>
</html>
