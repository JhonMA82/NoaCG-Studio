<!doctype html>
<!-- ============================================================================
     APERTURE BANDS - the editorial / news stinger.
     Hand-authored anchor for the NoaCG video corpus (docs/NOACG_VIDEO_PLAN.md §2.2/§2.4).

     Visual direction: precise and editorial, the opposite of replay-slab. Eight vertical
     bands grow from alternating edges until the frame is closed, THE SAME EIGHT COLUMNS then
     open off the mark one after another, and the bands retract from the far side.

     THE MARK IS NEVER ON A PLATE (§2.4). It is revealed by shutters cut on the band pitch,
     so the reveal is the same motion as the cover and the mark ends up sitting on the
     brand's own field with nothing framing it. That also makes the reveal work for ANY mark
     shape: a shutter does not care what is behind it, where slicing the mark itself would
     leave six empty columns for a square monogram.

     THE CONTRACT, and how this file keeps it:
       - 2.00 s at 1920x1080, transparent.
       - FRAME 0 IS EMPTY BY CONSTRUCTION: every band starts at scaleY 0, which paints
         nothing at all, and the payload starts at zero opacity. There is no first frame with
         a sliver of band on it.
       - THE LAST FRAME IS EMPTY THE SAME WAY: the last band finishes retracting at 1.91 s,
         inside the renderer's last frame (t = (N-1)/fps, i.e. 1.960 s at 25 fps).
       - FULL COVER 0.46 s -> 1.12 s (data-cut-start / data-cut-end). The bands are 242 px
         wide on a 240 px pitch and 1088 px tall on a -4 px top, so they OVERLAP each other
         by 2 px and overhang the frame: a tiled cover has to be built with overlap or it
         ships a one-pixel seam the outgoing feed flashes through, and an average-alpha check
         would never see it. The last band lands at 0.444 s and the first one does not start
         leaving until 1.40 s.
       - NOTHING PARKS during the cover: the shutters are still opening at 0.85, the rule
         draws to 1.10 and the lockup drifts to 1.40. A surface that arrives and sits there
         for the whole window reads as a slate, not as a transition.

     Operator numbers for an ATEM at this duration (Clip Duration = round(2.00 x fps)):
       25 fps -> 50 frames,  cut window frames 12-28,  Trigger Point 14
       30 fps -> 60 frames,  cut window frames 14-34,  Trigger Point 16
       50 fps -> 100 frames, cut window frames 23-56,  Trigger Point 25
       60 fps -> 120 frames, cut window frames 28-67,  Trigger Point 30
     ============================================================================ -->
<html lang="en" data-composition-variables='[
  {"id":"logo","type":"image","label":"Brand logo","default":"logo"},
  {"id":"label","type":"string","label":"Word","default":"THE REPORT"},
  {"id":"kicker","type":"string","label":"Kicker","default":"LIVE FROM THE NEWSROOM"},
  {"id":"brandDeep","type":"color","label":"Band colour","default":"#0E1A24"},
  {"id":"brandAccent","type":"color","label":"Accent colour","default":"#1F6FEB"},
  {"id":"brandInk","type":"color","label":"Text colour","default":"#F2F6FA"}
]'>
<head>
<meta charset="UTF-8" />
<title>Aperture bands stinger</title>
<style>
  body { margin: 0; }

  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  .clip { position: absolute; inset: 0; }

  /* The eight bands. 242 px wide on a 240 px pitch is a deliberate 2 px overlap, and the
     -4 px top with 1088 px height overhangs the frame: a tiled cover built edge-to-edge
     leaves sub-pixel seams once the compositor rounds. */
  .band {
    position: absolute;
    top: -4px;
    width: 242px;
    height: 1088px;
    background-color: var(--brandDeep, #0E1A24);
  }
  /* Alternating bands carry a light wash, so the closed frame reads as a built surface
     rather than one flat fill - derived from the brand colour, not a second colour the
     operator has to keep in sync. */
  .band:nth-child(even) {
    background-image: linear-gradient(rgba(255,255,255,0.055), rgba(255,255,255,0.055));
  }
  .band:nth-child(1) { left: -1px; }
  .band:nth-child(2) { left: 239px; }
  .band:nth-child(3) { left: 479px; }
  .band:nth-child(4) { left: 719px; }
  .band:nth-child(5) { left: 959px; }
  .band:nth-child(6) { left: 1199px; }
  .band:nth-child(7) { left: 1439px; }
  .band:nth-child(8) { left: 1679px; }

  #stage { display: flex; align-items: center; justify-content: center; }
  #payload { display: flex; flex-direction: column; align-items: center; }

  /* The mark, on nothing at all. #logo-reveal is the shutter frame: same width as the slot,
     hiding whatever leaves it. */
  #logo-reveal {
    position: relative;
    width: 1040px;
    height: 250px;
    overflow: hidden;
  }
  #logo-slot {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #logo { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* Eight shutters on the band pitch (1040 / 8 = 130), overlapping by 2 px for the same
     reason the bands do. They are the field colour, so while they are down the mark simply
     is not there - no ghost, no fade. They live in their own wrapper because nth-child
     counts SIBLINGS: sharing a parent with the slot would shift every index by one. */
  #shutters { position: absolute; inset: 0; }
  .shutter {
    position: absolute;
    top: -2px;
    width: 132px;
    height: 254px;
    background-color: var(--brandDeep, #0E1A24);
  }
  .shutter:nth-child(1) { left: -1px; }
  .shutter:nth-child(2) { left: 129px; }
  .shutter:nth-child(3) { left: 259px; }
  .shutter:nth-child(4) { left: 389px; }
  .shutter:nth-child(5) { left: 519px; }
  .shutter:nth-child(6) { left: 649px; }
  .shutter:nth-child(7) { left: 779px; }
  .shutter:nth-child(8) { left: 909px; }

  /* The rule sweeps the full frame width behind the lockup - the editorial equivalent of a
     light sweep, and part of why the covered stretch is never a still frame. */
  #rule {
    position: absolute;
    left: 0;
    top: 50%;
    width: 1920px;
    height: 4px;
    margin-top: 246px;
    background-color: var(--brandAccent, #1F6FEB);
  }

  #label-mask { overflow: hidden; padding: 0.08em 0.1em; margin-top: 34px; }
  #label {
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    font-size: 78px;
    font-weight: 700;
    line-height: 1.06;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--brandInk, #F2F6FA);
  }
  #kicker {
    margin-top: 18px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    color: var(--brandAccent, #1F6FEB);
  }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0"
     data-width="1920" data-height="1080" data-duration="2"
     data-cut-start="0.46" data-cut-end="1.12">
  <section id="bands" class="clip" data-start="0" data-duration="2" data-track-index="1">
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
  </section>
  <section id="stage" class="clip" data-start="0" data-duration="2" data-track-index="2">
    <div id="rule"></div>
    <div id="payload">
      <div id="logo-reveal">
        <div id="logo-slot"><img id="logo" data-var-src="logo" src="asset:logo" alt="" /></div>
        <div id="shutters">
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
          <div class="shutter"></div>
        </div>
      </div>
      <div id="label-mask"><div id="label" data-var-text="label">THE REPORT</div></div>
      <div id="kicker" data-var-text="kicker">LIVE FROM THE NEWSROOM</div>
    </div>
  </section>
</div>
<script>
  // One paused timeline; every position below is an absolute composition second.
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // Bands grow from alternating edges on the way in and retract toward the OPPOSITE edge on
  // the way out. Swapping the origin at 1.34 is invisible because the band is at full scale
  // there - a full-scale element looks identical whatever its origin.
  const growFrom = (i) => (i % 2 === 0 ? 'center top' : 'center bottom');
  const leaveTo = (i) => (i % 2 === 0 ? 'center bottom' : 'center top');

  // 0.02 -> 0.444  the frame closes, left to right.
  tl.fromTo('.band',
    { scaleY: 0, transformOrigin: growFrom },
    { scaleY: 1, transformOrigin: growFrom, duration: 0.20, ease: 'power3.out',
      stagger: { each: 0.032, from: 'start' } },
    0.02);

  // The payload exists from the moment the frame closes, but every part of it is still
  // hidden: the shutters are down, so the mark is not on screen until they lift.
  tl.fromTo('#payload', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.04, ease: 'none' }, 0.44);

  // 0.46 -> 1.12  FULL COVER. The same eight columns that closed the frame now open off the
  // mark, so the reveal is the cover's own motion rather than a second idea.
  // The last shutter has to be UP well before the window closes, or the mark is fully on
  // screen for a couple of frames and the whole reveal was for nothing: 0.48 + 7 x 0.026 +
  // 0.24 lands it at 0.90, which leaves the settled lockup 0.4 s of its own.
  tl.to('.shutter', { scaleY: 0, transformOrigin: 'center top', duration: 0.24, ease: 'power3.inOut',
    stagger: { each: 0.026, from: 'start' } }, 0.48);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
    { scaleX: 1, duration: 0.52, ease: 'power2.inOut' }, 0.58);
  tl.fromTo('#label', { yPercent: 112 }, { yPercent: 0, duration: 0.44, ease: 'power4.out' }, 0.72);
  tl.fromTo('#label-mask', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.06, ease: 'none' }, 0.72);
  tl.fromTo('#kicker', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.28, ease: 'none' }, 0.92);
  // A slow drift so the closed frame keeps moving right up to the moment it opens.
  tl.to('#payload', { y: -16, duration: 0.44, ease: 'sine.inOut' }, 0.96);

  // 1.30 -> 1.42  the lockup leaves first, so the bands are never seen cutting through it.
  tl.to('#payload', { autoAlpha: 0, y: -40, duration: 0.12, ease: 'power2.in' }, 1.30);
  tl.to('#rule', { autoAlpha: 0, duration: 0.12, ease: 'none' }, 1.30);

  // 1.40 -> 1.91  the frame opens again, this time right to left.
  tl.to('.band', { scaleY: 0, transformOrigin: leaveTo, duration: 0.30, ease: 'power3.in',
    stagger: { each: 0.030, from: 'end' } }, 1.40);

  window.__timelines['main'] = tl;
</script>
</body>
</html>
