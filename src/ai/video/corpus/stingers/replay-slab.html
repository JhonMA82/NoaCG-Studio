<!doctype html>
<!-- ============================================================================
     REPLAY SLAB - the sports "to slow-motion replay" stinger.
     Hand-authored anchor for the NoaCG video corpus (docs/NOACG_VIDEO_PLAN.md §2.2/§2.4).

     Visual direction: aggressive sports. One heavy angled slab drives across the frame behind
     a bright accent edge and closes it; the mark then lands on the slab oversized and drops
     into place, the rule draws, the word rises under it, and the whole lockup leaves riding
     the slab back out.

     THE SLAB COMES FIRST, THEN THE MARK (§2.4 rule 4). An earlier version had the mark cross
     the live picture ahead of the slab, and on review it read as a mistake: an outline mark
     over moving video is a few thin strokes on an unknown background, so the viewer sees a
     faint artifact rather than a brand. The mark only ever appears on a surface we control.

     THE MARK IS NEVER ON A PLATE (§2.4 rule 1). It sits directly on the brand's own field, so
     a brand supplies the version of its mark that suits the field colour it also supplies -
     the same rule the Lite brand work landed on. Framing a mark in a box to make it legible
     is a picture of a logo, not a logo.

     THE CONTRACT, and how this file keeps it:
       - 2.00 s at 1920x1080, transparent.
       - FRAME 0 IS EMPTY BY CONSTRUCTION: the slab group sits 3800 px to the left and every
         part of the lockup is at zero opacity. #root clips with overflow: hidden.
       - THE LAST FRAME IS EMPTY THE SAME WAY: slab and lockup both end at x = +3800 at
         1.92 s. 1.92 rather than 2.00 because the renderer's last frame is t = (N-1)/fps -
         1.960 / 1.967 / 1.980 / 1.983 s at 25 / 30 / 50 / 60 fps.
       - FULL COVER 0.46 s -> 1.12 s (data-cut-start / data-cut-end). The slab is 3072 x 2160
         and skewed 14 degrees; at rest it overhangs the frame by 307 px on every side even at
         the extremes of the skew, so the cover is opaque edge to edge with no seam. Both ends
         of the declared window are conservative: the slab covers well before 0.46 and is
         still covering past 1.4 s.

     Operator numbers for an ATEM at this duration (Clip Duration = round(2.00 x fps)):
       25 fps -> 50 frames,  cut window frames 12-28,  Trigger Point 14
       30 fps -> 60 frames,  cut window frames 14-34,  Trigger Point 16
       50 fps -> 100 frames, cut window frames 23-56,  Trigger Point 25
       60 fps -> 120 frames, cut window frames 28-67,  Trigger Point 30
     Trigger Point is the first fully covered frame plus 2 frames of safety; Mix Rate may be
     anything from 0 (a hard cut) up to the remaining length of the window.
     ============================================================================ -->
<html lang="en" data-composition-variables='[
  {"id":"logo","type":"image","label":"Brand logo","default":"logo"},
  {"id":"label","type":"string","label":"Word","default":"REPLAY"},
  {"id":"kicker","type":"string","label":"Kicker","default":"SLOW MOTION"},
  {"id":"brandDeep","type":"color","label":"Slab colour","default":"#101722"},
  {"id":"brandAccent","type":"color","label":"Accent colour","default":"#FF3B1F"},
  {"id":"brandInk","type":"color","label":"Text colour","default":"#F4F6F8"}
]'>
<head>
<meta charset="UTF-8" />
<title>Replay slab stinger</title>
<style>
  body { margin: 0; }

  /* The frame. No background: a stinger is transparent, and overflow: hidden is what makes
     "starts off-canvas" mean "paints nothing". */
  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  .clip { position: absolute; inset: 0; }

  /* The travelling slab group. */
  #group { position: absolute; inset: 0; }

  /* The slab: 1.6x the frame wide and 2x tall, skewed. The overhang is what guarantees the
     cover has no seam at any point of the skew. */
  #panel {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 3072px;
    height: 2160px;
    margin-left: -1536px;
    margin-top: -1080px;
    transform: skewX(-14deg);
    background-color: var(--brandDeep, #101722);
    /* A lit surface rather than a flat fill: same-hue shading across the travel direction. */
    background-image: linear-gradient(100deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 38%, rgba(0,0,0,0.35) 100%);
  }

  /* The accent rules. The pair on the right is the leading edge on the way in; the pair on
     the left is the trailing edge on the way out. Same skew, same height, so they stay
     locked to the slab's edges at every y. */
  .edge {
    position: absolute;
    left: 50%;
    top: 50%;
    height: 2160px;
    margin-top: -1080px;
    transform: skewX(-14deg);
    background-color: var(--brandAccent, #FF3B1F);
  }
  #edge-lead       { width: 30px; margin-left: 1536px; }
  #edge-lead-thin  { width: 12px; margin-left: 1590px; opacity: 0.55; }
  #edge-trail      { width: 30px; margin-left: -1566px; }
  #edge-trail-thin { width: 12px; margin-left: -1620px; opacity: 0.55; }

  /* The light sweep. The skew lives on the wrapper so GSAP only ever touches a plain
     translate - animating a transform property on an element that already carries one in
     CSS is how a skew silently disappears mid-render. */
  #sheen-wrap {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 900px;
    height: 2400px;
    margin-left: -450px;
    margin-top: -1200px;
    transform: skewX(-14deg);
  }
  #sheen {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0) 100%);
  }

  /* The lockup sits ABOVE the slab in the stacking order, which is what lets the mark cross
     the live picture first and keeps the slab reading as something it pulled in behind it.
     A centred column, so the layout is correct for any mark aspect and any word length. */
  #lockup {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* The mark, on nothing at all - a fixed box with object-fit: contain, so a 7.5:1 lockup
     and a 1:1 monogram both land inside it without the slot knowing which it got. */
  #logo-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 520px;
    height: 210px;
  }
  #logo { max-width: 100%; max-height: 100%; object-fit: contain; }

  #rule {
    width: 420px;
    height: 5px;
    margin: 26px 0 22px;
    background-color: var(--brandAccent, #FF3B1F);
  }

  #label-mask { overflow: hidden; padding: 0.08em 0.06em; }
  #label {
    font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
    font-size: 150px;
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--brandInk, #F4F6F8);
  }
  #kicker {
    margin-top: 6px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-transform: uppercase;
    color: var(--brandAccent, #FF3B1F);
  }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0"
     data-width="1920" data-height="1080" data-duration="2"
     data-cut-start="0.46" data-cut-end="1.12">
  <section id="wipe" class="clip" data-start="0" data-duration="2" data-track-index="1">
    <div id="group">
      <div id="panel"></div>
      <div id="edge-lead" class="edge"></div>
      <div id="edge-lead-thin" class="edge"></div>
      <div id="edge-trail" class="edge"></div>
      <div id="edge-trail-thin" class="edge"></div>
      <div id="sheen-wrap"><div id="sheen"></div></div>
    </div>
    <div id="lockup">
      <div id="logo-slot"><img id="logo" data-var-src="logo" src="asset:logo" alt="" /></div>
      <div id="rule"></div>
      <div id="label-mask"><div id="label" data-var-text="label">REPLAY</div></div>
      <div id="kicker" data-var-text="kicker">SLOW MOTION</div>
    </div>
  </section>
</div>
<script>
  // One paused timeline; every position below is an absolute composition second.
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // Far enough that the slab, both edge rules and the lockup are all outside the frame.
  const TRAVEL = 3800;

  // 0.00 -> 0.42  the slab closes the frame. NOTHING ELSE happens over the live picture:
  // the mark waits for a surface it can be read on (§2.4 rule 4).
  tl.fromTo('#group', { x: -TRAVEL }, { x: 0, duration: 0.42, ease: 'power4.out' }, 0);

  // 0.44 -> 1.12  FULL COVER. Everything the viewer is meant to read happens here, because
  // this is the only stretch that is guaranteed to be on screen. The mark arrives oversized
  // and drops into the lockup; the word rises underneath it.
  tl.fromTo('#logo-slot', { scale: 1.42, y: 74, rotation: -5, autoAlpha: 0 },
    { autoAlpha: 1, duration: 0.08, ease: 'none' }, 0.44);
  tl.to('#logo-slot', { scale: 1, y: 0, rotation: 0, duration: 0.44, ease: 'power4.out' }, 0.44);
  tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'center center', autoAlpha: 0 },
    { scaleX: 1, autoAlpha: 1, duration: 0.34, ease: 'power3.out' }, 0.58);
  tl.fromTo('#label', { yPercent: 118 }, { yPercent: 0, duration: 0.44, ease: 'power4.out' }, 0.62);
  tl.fromTo('#label-mask', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.06, ease: 'none' }, 0.62);
  tl.fromTo('#kicker', { autoAlpha: 0, x: 26 }, { autoAlpha: 1, x: 0, duration: 0.34, ease: 'power2.out' }, 0.78);

  // The light sweep crosses the slab while the type settles, so the cover is never a still
  // frame - a stinger that freezes mid-transition reads as a dropped feed.
  tl.fromTo('#sheen-wrap', { xPercent: -150, autoAlpha: 0 },
    { xPercent: 150, autoAlpha: 1, duration: 0.52, ease: 'sine.inOut' }, 0.66);
  tl.to('#sheen-wrap', { autoAlpha: 0, duration: 0.16, ease: 'none' }, 1.06);

  // A slow lean with the travel direction, so the lockup is already going before the slab
  // takes it.
  tl.to('#lockup', { x: 34, duration: 0.72, ease: 'sine.inOut' }, 0.88);

  // 1.24 -> 1.92  clear out to the right; the trailing accent rules leave last, and the
  // lockup rides the slab rather than being erased under it.
  // power2.in keeps the frame covered well past the declared 1.12 end of the window.
  tl.to('#group', { x: TRAVEL, duration: 0.68, ease: 'power2.in' }, 1.24);
  tl.to('#lockup', { x: TRAVEL, duration: 0.66, ease: 'power2.in' }, 1.26);

  window.__timelines['main'] = tl;
</script>
</body>
</html>
