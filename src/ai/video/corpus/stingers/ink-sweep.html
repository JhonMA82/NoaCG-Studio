<!doctype html>
<!-- ============================================================================
     INK SWEEP - the mark paints the cover. No panel arrives at any point.
     Hand-authored anchor for the NoaCG video corpus (docs/NOACG_VIDEO_PLAN.md §2.2/§2.4).

     Visual direction: brand ink is laid across the frame in ten ragged bands that open from
     the middle outward, each led by a bright accent edge - a brush stroke rather than a
     panel. Once the frame is inked the mark lands on it, carried in with the flow, and the
     word rises under it. At the end the ink retreats the way it came and takes the mark
     with it.

     WHY IT EXISTS: §2.4 rule 5. A stinger used as a transition must fully cover, because the
     switcher cuts underneath it - but the covering surface does not have to be a rectangle
     that arrives and parks. Here the cover is a stroke of the brand's own ink, with a ragged
     leading edge, and it never sits still. It also works for every mark in the swap set,
     which a design that covers with the mark's own silhouette cannot do - an outline mark has
     no solid mass to fill a frame with.

     NOTHING BUT THE INK IS ON THE LIVE PICTURE (§2.4 rule 4). The brush tip is the accent
     edge of the ink itself, not the mark: an earlier version sent the mark across the feed
     ahead of the stroke and it read as a few thin strokes on an unknown background - a fault,
     not a brand. THE MARK IS NEVER ON A PLATE EITHER (rule 1): once the ink is down it is the
     brand's own field, and that is the only surface the mark is ever seen on.

     THE CONTRACT, and how this file keeps it:
       - 2.00 s at 1920x1080, transparent.
       - FRAME 0 IS EMPTY BY CONSTRUCTION: every ink band sits at x = -1400, which puts its
         right edge at -440, and every part of the lockup is at zero opacity. #root clips with
         overflow: hidden.
       - THE LAST FRAME IS EMPTY THE SAME WAY: the last band clears at 1.906 s and the mark at
         1.78 s. 1.906 rather than 2.00 because the renderer's last frame is t = (N-1)/fps -
         1.960 s at 25 fps, 1.983 s at 60 fps.
       - FULL COVER 0.46 s -> 1.12 s (data-cut-start / data-cut-end). Each band is 4000 px
         wide with its right edge at frame centre plus its own x, and 128 px tall on a 120 px
         pitch from top -40, so the bands OVERLAP each other by 8 px and overhang the frame
         top and bottom. The last band passes the right frame edge at about 0.34 s and the
         retreat does not start until 1.30 s.
       - THE MARK NEVER OUTRUNS ITS OWN INK ON THE WAY OUT: it exits 2600 px on the same
         duration and ease as the bands' 2500 px, so its trailing edge stays behind the ink
         edge for the whole retreat. A mark that emerged onto the incoming picture during the
         wipe-off would be the same defect as one painting on the outgoing picture.

     Operator numbers for an ATEM at this duration (Clip Duration = round(2.00 x fps)):
       25 fps -> 50 frames,  cut window frames 12-28,  Trigger Point 14
       30 fps -> 60 frames,  cut window frames 14-34,  Trigger Point 16
       50 fps -> 100 frames, cut window frames 23-56,  Trigger Point 25
       60 fps -> 120 frames, cut window frames 28-67,  Trigger Point 30
     ============================================================================ -->
<html lang="en" data-composition-variables='[
  {"id":"logo","type":"image","label":"Brand logo","default":"logo"},
  {"id":"label","type":"string","label":"Word","default":"HIGHLIGHTS"},
  {"id":"kicker","type":"string","label":"Kicker","default":"BEST OF THE WEEK"},
  {"id":"brandDeep","type":"color","label":"Ink colour","default":"#12181F"},
  {"id":"brandAccent","type":"color","label":"Accent colour","default":"#FF9F1C"},
  {"id":"brandInk","type":"color","label":"Text colour","default":"#F5F7FA"}
]'>
<head>
<meta charset="UTF-8" />
<title>Ink sweep stinger</title>
<style>
  body { margin: 0; }

  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  }
  .clip { position: absolute; inset: 0; }

  /* The ink. Ten bands, each reaching far off to the left, so what you see at any moment is
     the ink laid down BEHIND the mark rather than a panel sliding in. box-sizing keeps the
     accent edge inside the declared width, so the right edge of the band and the right edge
     of the accent are the same number. */
  #ink { position: absolute; inset: 0; }
  .ink-band {
    position: absolute;
    right: 50%;
    width: 4000px;
    height: 128px;
    box-sizing: border-box;
    background-color: var(--brandDeep, #12181F);
    border-right: 13px solid var(--brandAccent, #FF9F1C);
  }
  /* Alternating bands carry a light wash, so the filled frame reads as laid ink rather than
     one flat fill - derived from the brand colour, not a second colour to keep in sync. */
  .ink-band:nth-child(even) {
    background-image: linear-gradient(rgba(128,128,128,0.24), rgba(128,128,128,0.24));
  }
  .ink-band:nth-child(1)  { top: -40px; }
  .ink-band:nth-child(2)  { top: 80px; }
  .ink-band:nth-child(3)  { top: 200px; }
  .ink-band:nth-child(4)  { top: 320px; }
  .ink-band:nth-child(5)  { top: 440px; }
  .ink-band:nth-child(6)  { top: 560px; }
  .ink-band:nth-child(7)  { top: 680px; }
  .ink-band:nth-child(8)  { top: 800px; }
  .ink-band:nth-child(9)  { top: 920px; }
  .ink-band:nth-child(10) { top: 1040px; }

  /* The mark and the words travel together: the mark is the brush tip on the way in and the
     lockup's anchor once the frame is full. Above the ink, always. */
  #lockup {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* The mark, on nothing at all - a fixed box with object-fit: contain, so a 7.5:1 lockup and
     a 1:1 monogram both land inside it without the slot knowing which it got. */
  #logo-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 800px;
    height: 340px;
  }
  /* width/height 100% and NOT max-*: max-width only ever SHRINKS an image, so a mark whose
     SVG declares 120x120 rendered at 120 px in a 340 px slot and the whole graphic read as
     empty. object-fit: contain is what preserves the aspect once the box is the slot. */
    #logo { width: 100%; height: 100%; object-fit: contain; }

  #hairline {
    width: 560px;
    height: 6px;
    margin: 34px 0 28px;
    background-color: var(--brandAccent, #FF9F1C);
  }

  #label-mask { overflow: hidden; padding: 0.08em 0.1em; }
  #label {
    font-size: 112px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    color: var(--brandInk, #F5F7FA);
  }
  #kicker {
    margin-top: 16px;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    text-transform: uppercase;
    color: var(--brandAccent, #FF9F1C);
  }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0"
     data-width="1920" data-height="1080" data-duration="2"
     data-cut-start="0.46" data-cut-end="1.12">
  <section id="sweep" class="clip" data-start="0" data-duration="2" data-track-index="1">
    <div id="ink">
      <div class="ink-band"></div>
      <div class="ink-band"></div>
      <div class="ink-band"></div>
      <div class="ink-band"></div>
      <div class="ink-band"></div>
      <div class="ink-band"></div>
      <div class="ink-band"></div>
      <div class="ink-band"></div>
      <div class="ink-band"></div>
      <div class="ink-band"></div>
    </div>
    <div id="lockup">
      <div id="logo-slot"><img id="logo" data-var-src="logo" src="asset:logo" alt="" /></div>
      <div id="hairline"></div>
      <div id="label-mask"><div id="label" data-var-text="label">HIGHLIGHTS</div></div>
      <div id="kicker" data-var-text="kicker">BEST OF THE WEEK</div>
    </div>
  </section>
</div>
<script>
  // One paused timeline; every position below is an absolute composition second.
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  const INK_IN = 1100;    // right edge lands at 960 + 1100 = 2060, past the frame
  const INK_OUT = -1400;  // right edge back to -440, off the frame

  // 0.02 -> 0.41  the ink lays down, opening from the middle outward so the leading edge is
  // ragged rather than a slab's straight cut. The last band passes the right frame edge at
  // about 0.34 s.
  tl.fromTo('.ink-band', { x: INK_OUT },
    { x: INK_IN, duration: 0.30, ease: 'power2.out', stagger: { each: 0.018, from: 'center' } }, 0.02);

  // 0.44 -> 1.12  FULL COVER. The mark lands ON the ink, never ahead of it (§2.4 rule 4),
  // and settles WITH the flow so it reads as something the sweep carried in. The whole
  // window is one continuous move, never a held frame.
  tl.fromTo('#logo-slot', { x: -150, scale: 0.86, rotation: -4, autoAlpha: 0 },
    { autoAlpha: 1, duration: 0.08, ease: 'none' }, 0.44);
  tl.to('#logo-slot', { x: 0, scale: 1, rotation: 0, duration: 0.44, ease: 'power3.out' }, 0.44);
  tl.fromTo('#hairline', { scaleX: 0, transformOrigin: 'center center', autoAlpha: 0 },
    { scaleX: 1, autoAlpha: 1, duration: 0.38, ease: 'power3.out' }, 0.62);
  tl.fromTo('#label', { yPercent: 114 }, { yPercent: 0, duration: 0.44, ease: 'power4.out' }, 0.68);
  tl.fromTo('#label-mask', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.06, ease: 'none' }, 0.68);
  tl.fromTo('#kicker', { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.32, ease: 'power2.out' }, 0.86);
  tl.to('#lockup', { x: -26, duration: 0.44, ease: 'sine.inOut' }, 0.98);

  // 1.30 -> 1.906  the ink retreats the way it came and takes the mark with it. The lockup
  // travels 2600 px on the SAME duration and ease as the bands' 2500 px, so it never emerges
  // ahead of the ink edge onto the incoming picture.
  tl.to('.ink-band', { x: INK_OUT, duration: 0.48, ease: 'power2.in',
    stagger: { each: 0.014, from: 'end' } }, 1.30);
  tl.to('#lockup', { x: -2600, duration: 0.48, ease: 'power2.in' }, 1.30);

  window.__timelines['main'] = tl;
</script>
</body>
</html>
