<!doctype html>
<!-- ============================================================================
     RADIAL BLOOM - repetition and glow, the technique the reference teardown found.
     Hand-authored anchor for the NoaCG video corpus (docs/NOACG_VIDEO_PLAN.md §2.2/§2.4).

     Visual direction: a disc of brand ink opens from a point and four rings of small repeated
     elements bloom out of it - dots, outward dashes, diamonds, more dots - each turning at its
     own rate and in its own direction, all of them glowing. The mark lands in the middle, a
     pulse ring rides out through the pattern twice, and at the end the whole thing irises shut
     to nothing.

     WHY IT EXISTS: `benchmarks/video/v1/STINGER-REFERENCE-TEARDOWN.md` §3. Of the eight
     commercial stingers measured, the one that most looks like a rendered effect - Kaleidoscope
     Reveal - is a pattern of flat shapes: one element repeated at many angles and radii,
     rotating, with a glow. It has the longest full-cover window in the set (1.24 s of 2.12 s)
     and it is the highest richness per line of code available to us. The corpus had nothing
     like it. This is that technique, in our vocabulary.

     Also the corpus's first IRIS CLOSE: the exit reveals the incoming picture from the outside
     in, where every other exemplar wipes, opens or shatters. That is a different reveal shape
     for a switcher to cut behind, which is the whole point of a corpus.

     THE COVER COMES FIRST, THEN THE MARK (§2.4 rule 4), the mark sits on the brand's field with
     nothing behind it (rule 1), and nothing is ever at rest inside the window (rule 2) - the
     four rings turn from 0.10 s to 1.60 s and the pulse crosses the pattern twice.

     THE CONTRACT, and how this file keeps it:
       - 2.00 s at 1920x1080, transparent.
       - FRAME 0 IS EMPTY BY CONSTRUCTION: #iris is at scale 0, and a zero-area box paints
         nothing at all. Nothing fades in from a visible state.
       - THE LAST FRAME IS EMPTY THE SAME WAY: the iris is back to scale 0 at 1.92 s. 1.92
         rather than 2.00 because the renderer's last frame is t = (N-1)/fps - 1.960 s at
         25 fps, 1.983 s at 60 fps.
       - FULL COVER 0.46 s -> 1.12 s (data-cut-start / data-cut-end). The covering surface is a
         2400 px disc, and the frame's half-diagonal is 1102 px, so it covers from scale 0.918
         upward - reached at about 0.15 s and held until about 1.49 s, well outside the
         declared window at both ends. The rings and the pulse are ORNAMENT on top of that
         disc; the cover never depends on them.

     Operator numbers for an ATEM at this duration (Clip Duration = round(2.00 x fps)):
       25 fps -> 50 frames,  cut window frames 12-28,  Trigger Point 14
       30 fps -> 60 frames,  cut window frames 14-34,  Trigger Point 16
       50 fps -> 100 frames, cut window frames 23-56,  Trigger Point 25
       60 fps -> 120 frames, cut window frames 28-67,  Trigger Point 30
     ============================================================================ -->
<html lang="en" data-composition-variables='[
  {"id":"logo","type":"image","label":"Brand logo","default":"logo"},
  {"id":"label","type":"string","label":"Word","default":"COMING UP"},
  {"id":"kicker","type":"string","label":"Kicker","default":"AFTER THE BREAK"},
  {"id":"brandDeep","type":"color","label":"Field colour","default":"#120A1E"},
  {"id":"brandAccent","type":"color","label":"Accent colour","default":"#7DF9FF"},
  {"id":"brandInk","type":"color","label":"Text colour","default":"#F2F0FA"}
]'>
<head>
<meta charset="UTF-8" />
<title>Radial bloom stinger</title>
<style>
  body { margin: 0; }

  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
  }
  .clip { position: absolute; inset: 0; }

  /* Everything lives inside the iris, so ONE scale opens the graphic and closes it. */
  #iris { position: absolute; inset: 0; }

  /* The covering surface. Big enough that the frame's corners are inside it well before the
     opening finishes: half-diagonal 1102 px against a radius of 1200. The gradients only
     shade an already-opaque colour - a covering surface whose edge fades out is not a cover. */
  #disc {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2400px;
    height: 2400px;
    margin: -1200px 0 0 -1200px;
    border-radius: 50%;
    background-color: var(--brandDeep, #120A1E);
    background-image:
      radial-gradient(closest-side, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0) 55%),
      radial-gradient(closest-side at 50% 100%, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 60%);
  }

  /* Each ring is a ZERO-SIZED anchor at the centre. Its items carry their own CSS transform
     (rotate then push outward), and GSAP only ever touches the anchor - animating a transform
     on an element that already has one in CSS is how a placement silently disappears. */
  .ring { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .ring > * { position: absolute; left: 0; top: 0; }

  /* The glow lives on the ring rather than on 24 separate elements: one filter pass instead of
     two dozen shadows, and it stays a single decision to tune. */
  #ring-dots-inner { filter: drop-shadow(0 0 14px var(--brandAccent, #7DF9FF)); }
  #ring-dots-outer { filter: drop-shadow(0 0 8px var(--brandAccent, #7DF9FF)); }
  #ring-diamonds   { filter: drop-shadow(0 0 10px var(--brandAccent, #7DF9FF)); }

  .dot {
    width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border-radius: 50%;
    background-color: var(--brandAccent, #7DF9FF);
  }
  .dot-sm {
    width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
    border-radius: 50%;
    background-color: var(--brandInk, #F2F0FA);
    opacity: 0.45;
  }
  /* Dashes point outward: they inherit the item's own rotation, which is the reason the item
     transform rotates before it translates. */
  .dash {
    width: 4px; height: 24px; margin: -12px 0 0 -2px;
    background-color: var(--brandInk, #F2F0FA);
    opacity: 0.6;
  }
  .diamond {
    width: 34px; height: 34px; margin: -17px 0 0 -17px;
    border: 3px solid var(--brandAccent, #7DF9FF);
    border-radius: 5px;
  }

  /* Concentric rules. Plain bordered circles, sized to their own diameter. */
  .circle {
    position: absolute; left: 50%; top: 50%;
    border-radius: 50%;
    border-style: solid;
  }
  #circle-a { width: 720px;  height: 720px;  margin: -360px 0 0 -360px; border-width: 2px; border-style: dashed; border-color: var(--brandAccent, #7DF9FF); opacity: 0.55; }
  #circle-b { width: 1010px; height: 1010px; margin: -505px 0 0 -505px; border-width: 1px; border-color: var(--brandInk, #F2F0FA); opacity: 0.28; }
  #circle-c { width: 1300px; height: 1300px; margin: -650px 0 0 -650px; border-width: 3px; border-color: var(--brandAccent, #7DF9FF); opacity: 0.4; }
  /* The pulse rides out through the pattern and fades - the reason the covered stretch reads
     as something still happening rather than a held frame. */
  #pulse {
    width: 900px; height: 900px; margin: -450px 0 0 -450px;
    border-width: 4px;
    border-color: var(--brandAccent, #7DF9FF);
  }

  #payload {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* The mark, on nothing at all - a fixed box with object-fit: contain, so a 7.5:1 lockup and
     a 1:1 monogram both land inside it without the slot knowing which it got. */
  #logo-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 540px;
    height: 210px;
  }
  #logo { max-width: 100%; max-height: 100%; object-fit: contain; }

  #hairline {
    width: 300px; height: 2px;
    margin: 34px 0 28px;
    background-color: var(--brandAccent, #7DF9FF);
  }

  #label-mask { overflow: hidden; padding: 0.1em 0.16em; }
  #label {
    font-size: 60px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    color: var(--brandInk, #F2F0FA);
  }
  #kicker {
    margin-top: 20px;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.44em;
    text-indent: 0.44em;
    text-transform: uppercase;
    color: var(--brandAccent, #7DF9FF);
  }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0"
     data-width="1920" data-height="1080" data-duration="2"
     data-cut-start="0.46" data-cut-end="1.12">
  <section id="bloom" class="clip" data-start="0" data-duration="2" data-track-index="1">
    <div id="iris">
      <div id="disc"></div>
      <div id="circle-a" class="circle"></div>
      <div id="circle-b" class="circle"></div>
      <div id="circle-c" class="circle"></div>
      <div id="ring-dots-inner" class="ring"></div>
      <div id="ring-dashes" class="ring"></div>
      <div id="ring-diamonds" class="ring"></div>
      <div id="ring-dots-outer" class="ring"></div>
      <div id="pulse" class="circle"></div>
      <div id="payload">
        <div id="logo-slot"><img id="logo" data-var-src="logo" src="asset:logo" alt="" /></div>
        <div id="hairline"></div>
        <div id="label-mask"><div id="label" data-var-text="label">COMING UP</div></div>
        <div id="kicker" data-var-text="kicker">AFTER THE BREAK</div>
      </div>
    </div>
  </section>
</div>
<script>
  // The rings are BUILT, not hand-written: 120 elements typed out would be unreadable and
  // unmaintainable, and a loop is exactly as deterministic - same code, same DOM, every time.
  // No randomness anywhere, so every frame renders identically from a cold seek.
  function buildRing(id, className, count, radius, spin) {
    var wrap = document.getElementById(id);
    for (var i = 0; i < count; i++) {
      var el = document.createElement('div');
      el.className = className;
      // Rotate first, then push outward: the item lands at that angle AND faces outward,
      // which is what makes the dashes read as spokes rather than as scattered ticks. A
      // trailing spin turns the squares onto their corners without disturbing that.
      el.style.transform = 'rotate(' + (360 / count) * i + 'deg) translateY(' + -radius + 'px)'
        + (spin ? ' rotate(' + spin + 'deg)' : '');
      wrap.appendChild(el);
    }
  }
  buildRing('ring-dots-inner', 'dot', 24, 300);
  buildRing('ring-dashes', 'dash', 36, 430);
  buildRing('ring-diamonds', 'diamond', 12, 580, 45);
  buildRing('ring-dots-outer', 'dot-sm', 48, 720);

  // One paused timeline; every position below is an absolute composition second.
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // 0.00 -> 0.40  the iris opens from a point. The disc alone is the cover; everything after
  // this is ornament on top of it.
  tl.fromTo('#iris', { scale: 0, transformOrigin: 'center center' },
    { scale: 1, duration: 0.40, ease: 'expo.out' }, 0);

  // 0.06 -> 0.62  the pattern blooms outward, inner rings first.
  const bloom = [
    ['#circle-a', 0.06], ['#ring-dots-inner', 0.10], ['#circle-b', 0.16],
    ['#ring-dashes', 0.20], ['#circle-c', 0.26], ['#ring-diamonds', 0.30],
    ['#ring-dots-outer', 0.36],
  ];
  bloom.forEach(function (b) {
    tl.fromTo(b[0], { scale: 0.35, autoAlpha: 0 },
      { scale: 1, autoAlpha: 1, duration: 0.42, ease: 'power3.out' }, b[1]);
  });

  // 0.10 -> 1.60  the rings turn, each at its own rate and direction. Finite rotations to a
  // fixed angle, never a repeat: an endless tween cannot render deterministically.
  tl.to('#ring-dots-inner', { rotation: 26, duration: 1.5, ease: 'none' }, 0.10);
  tl.to('#ring-dashes', { rotation: -18, duration: 1.5, ease: 'none' }, 0.10);
  tl.to('#ring-diamonds', { rotation: 15, duration: 1.5, ease: 'none' }, 0.10);
  tl.to('#ring-dots-outer', { rotation: -34, duration: 1.5, ease: 'none' }, 0.10);
  tl.to('#circle-a', { rotation: 40, duration: 1.5, ease: 'none' }, 0.10);

  // 0.44 -> 1.12  FULL COVER. The mark arrives on the field, the lockup builds, and the pulse
  // crosses the whole pattern twice so nothing in the window is ever still.
  tl.fromTo('#payload', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.08, ease: 'none' }, 0.44);
  tl.from('#logo-slot', { scale: 0.72, duration: 0.44, ease: 'back.out(1.5)' }, 0.44);
  tl.fromTo('#hairline', { scaleX: 0, transformOrigin: 'center center' },
    { scaleX: 1, duration: 0.40, ease: 'power3.out' }, 0.58);
  tl.fromTo('#label', { yPercent: 112 }, { yPercent: 0, duration: 0.44, ease: 'power4.out' }, 0.66);
  tl.fromTo('#label-mask', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.06, ease: 'none' }, 0.66);
  tl.fromTo('#kicker', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.30, ease: 'none' }, 0.86);
  tl.fromTo('#pulse', { scale: 0.18, autoAlpha: 0.9 },
    { scale: 1.9, autoAlpha: 0, duration: 0.62, ease: 'power2.out', repeat: 1 }, 0.54);

  // 1.32 -> 1.92  the iris shuts, turning as it goes: the incoming picture is revealed from
  // the outside in, which no other exemplar does. The frame stays fully covered until about
  // 1.49 s, well past the declared 1.12 end of the window.
  tl.to('#iris', { scale: 0, rotation: 16, duration: 0.60, ease: 'power2.in' }, 1.32);

  window.__timelines['main'] = tl;
</script>
</body>
</html>
