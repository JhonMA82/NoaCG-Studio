<!doctype html>
<!-- ============================================================================
     HALFTONE CUT - printed texture, from the reference pack's vocabulary.
     Hand-authored anchor for the NoaCG video corpus (docs/NOACG_VIDEO_PLAN.md §2.2/§2.4).

     Visual direction: two panels close on a diagonal seam, the upper one carrying a halftone
     dot field and the lower one diagonal hatching, so the covered frame reads as PRINTED
     rather than as flat colour. The mark lands on the seam, the word rises under it, and the
     panels part again on the same diagonal.

     WHY IT EXISTS: `benchmarks/video/v1/STINGER-REFERENCE-TEARDOWN.md` §3 item 4. Hatched and
     halftone fills are what makes the commercial transitions pack read as designed rather than
     as flat blocks, they cost two CSS gradients, and the corpus had nothing textured in it.
     The diagonal two-panel close is also a sixth reveal shape for a switcher to cut behind.

     THE COVER COMES FIRST, THEN THE MARK (§2.4 rule 4); the mark sits on the brand's own field
     with nothing behind it (rule 1); nothing rests inside the window (rule 2) - the texture
     drifts across the seam the whole way through.

     THE CONTRACT, and how this file keeps it:
       - 2.00 s at 1920x1080, transparent.
       - FRAME 0 IS EMPTY BY CONSTRUCTION: the upper panel sits 1400 px above the frame and the
         lower one 1400 px below, and #root clips with overflow: hidden.
       - THE LAST FRAME IS EMPTY THE SAME WAY: both panels are back off frame at 1.90 s. 1.90
         rather than 2.00 because the renderer's last frame is t = (N-1)/fps - 1.960 s at
         25 fps, 1.983 s at 60 fps.
       - FULL COVER 0.46 s -> 1.12 s (data-cut-start / data-cut-end). THE SEAM IS THE WHOLE
         RISK in a two-panel design, so the panels are built to overlap by about 200 px along
         it at every x: the upper one's lower edge crosses the frame between y 556 and 724, the
         lower one's upper edge between 356 and 524. They are 2400 px wide, so the 5 degree
         skew never pulls a corner inside the frame.

     Operator numbers for an ATEM at this duration (Clip Duration = round(2.00 x fps)):
       25 fps -> 50 frames,  cut window frames 12-28,  Trigger Point 14
       30 fps -> 60 frames,  cut window frames 14-34,  Trigger Point 16
       50 fps -> 100 frames, cut window frames 23-56,  Trigger Point 25
       60 fps -> 120 frames, cut window frames 28-67,  Trigger Point 30
     ============================================================================ -->
<html lang="en" data-composition-variables='[
  {"id":"logo","type":"image","label":"Brand logo","default":"logo"},
  {"id":"label","type":"string","label":"Word","default":"HALF TIME"},
  {"id":"kicker","type":"string","label":"Kicker","default":"BACK IN A MOMENT"},
  {"id":"brandDeep","type":"color","label":"Panel colour","default":"#14202B"},
  {"id":"brandAccent","type":"color","label":"Accent colour","default":"#FFC300"},
  {"id":"brandInk","type":"color","label":"Text colour","default":"#F4F7FA"}
]'>
<head>
<meta charset="UTF-8" />
<title>Halftone cut stinger</title>
<style>
  body { margin: 0; }

  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  }
  .clip { position: absolute; inset: 0; }

  /* Both panels are oversized and skewed on Y, so their long edges slant and their short ones
     never reach the frame. skewY and not skewX: a horizontal shear would slant the SIDES and
     leave the seam flat, which is the opposite of the effect. */
  /* The MOVER carries the travel and the PANEL carries the skew. Never both on one element:
     GSAP writes a whole transform, so animating y on something that already declares a skew in
     CSS is how the skew silently disappears mid-render. */
  .mover { position: absolute; inset: 0; }
  .panel {
    position: absolute;
    left: 50%;
    width: 2400px;
    height: 1200px;
    margin-left: -1200px;
    background-color: var(--brandDeep, #14202B);
    transform: skewY(-5deg);
  }
  #panel-top { top: -560px; }
  #panel-bottom { top: 440px; }

  /* The texture. A halftone above, diagonal hatching below - both are ONE gradient each, and
     both are drawn in the accent colour so a brand swap carries them. The wrappers inherit the
     panels' skew by living inside them. */
  .texture { position: absolute; inset: 0; }
  #halftone {
    opacity: 0.34;
    background-image: radial-gradient(circle at center, var(--brandAccent, #FFC300) 3px, rgba(0,0,0,0) 3.5px);
    background-size: 26px 26px;
  }
  #hatch {
    opacity: 0.22;
    background-image: repeating-linear-gradient(48deg,
      var(--brandAccent, #FFC300) 0px, var(--brandAccent, #FFC300) 3px, rgba(0,0,0,0) 3px, rgba(0,0,0,0) 16px);
  }
  /* The seam rule rides the join, so the diagonal is a decision rather than an accident. */
  #seam {
    position: absolute;
    left: 50%;
    top: 634px;
    width: 2400px;
    height: 8px;
    margin-left: -1200px;
    background-color: var(--brandAccent, #FFC300);
    transform: skewY(-5deg);
  }

  /* The lockup is pulled ABOVE the seam rather than centred on it: centred, the accent rule
     cut straight through the word, which reads as a mistake rather than as a layout. Sitting
     the whole lockup in the upper panel turns the seam into its underline. */
  #lockup {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 400px;
    box-sizing: border-box;
  }
  #logo-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 720px;
    height: 300px;
  }
  /* width/height 100% and NOT max-*: max-width only ever SHRINKS an image, so a mark whose
     SVG declares 120x120 renders at 120 px in a 300 px slot and the whole graphic reads as
     empty. object-fit: contain is what preserves the aspect once the box is the slot. */
  #logo { width: 100%; height: 100%; object-fit: contain; }

  #label-mask { overflow: hidden; padding: 0.08em 0.1em; margin-top: 26px; }
  #label {
    font-size: 118px;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--brandInk, #F4F7FA);
  }
  #kicker {
    margin-top: 18px;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-transform: uppercase;
    color: var(--brandAccent, #FFC300);
  }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0"
     data-width="1920" data-height="1080" data-duration="2"
     data-cut-start="0.46" data-cut-end="1.12">
  <section id="cut" class="clip" data-start="0" data-duration="2" data-track-index="1">
    <div id="move-top" class="mover"><div id="panel-top" class="panel"><div id="halftone" class="texture"></div></div></div>
    <div id="move-bottom" class="mover"><div id="panel-bottom" class="panel"><div id="hatch" class="texture"></div></div></div>
    <div id="move-seam" class="mover"><div id="seam"></div></div>
    <div id="lockup">
      <div id="logo-slot"><img id="logo" data-var-src="logo" src="asset:logo" alt="" /></div>
      <div id="label-mask"><div id="label" data-var-text="label">HALF TIME</div></div>
      <div id="kicker" data-var-text="kicker">BACK IN A MOMENT</div>
    </div>
  </section>
</div>
<script>
  // One paused timeline; every position below is an absolute composition second.
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const OFF = 1400;

  // 0.00 -> 0.42  the two panels close on the diagonal. Nothing else is on the live picture.
  tl.fromTo('#move-top', { y: -OFF }, { y: 0, duration: 0.42, ease: 'power4.out' }, 0);
  tl.fromTo('#move-bottom', { y: OFF }, { y: 0, duration: 0.42, ease: 'power4.out' }, 0.04);
  tl.fromTo('#move-seam', { y: -OFF, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.42, ease: 'power4.out' }, 0.02);

  // 0.44 -> 1.12  FULL COVER. The mark lands on the seam and the word rises under it.
  tl.fromTo('#lockup', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.08, ease: 'none' }, 0.44);
  tl.from('#logo-slot', { y: 44, scale: 0.9, duration: 0.44, ease: 'power4.out' }, 0.44);
  tl.fromTo('#label', { yPercent: 112 }, { yPercent: 0, duration: 0.44, ease: 'power4.out' }, 0.62);
  tl.fromTo('#label-mask', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.06, ease: 'none' }, 0.62);
  tl.fromTo('#kicker', { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.30, ease: 'power2.out' }, 0.82);

  // The texture drifts across the seam in opposite directions for the whole window, so the
  // covered frame is never a still image even while the lockup is settled.
  tl.fromTo('#halftone', { backgroundPosition: '0px 0px' }, { backgroundPosition: '78px 0px', duration: 1.0, ease: 'none' }, 0.30);
  tl.fromTo('#hatch', { backgroundPosition: '0px 0px' }, { backgroundPosition: '-64px 0px', duration: 1.0, ease: 'none' }, 0.30);
  tl.to('#lockup', { y: -18, duration: 0.44, ease: 'sine.inOut' }, 0.94);

  // 1.28 -> 1.90  the panels part on the same diagonal, taking the lockup with them: the
  // upper one carries it up, so nothing is left standing on the incoming picture.
  tl.to('#lockup', { autoAlpha: 0, y: -70, duration: 0.16, ease: 'power2.in' }, 1.28);
  tl.to('#move-top', { y: -OFF, duration: 0.60, ease: 'power2.in' }, 1.30);
  tl.to('#move-seam', { y: -OFF, duration: 0.60, ease: 'power2.in' }, 1.30);
  tl.to('#move-bottom', { y: OFF, duration: 0.60, ease: 'power2.in' }, 1.30);

  window.__timelines['main'] = tl;
</script>
</body>
</html>
