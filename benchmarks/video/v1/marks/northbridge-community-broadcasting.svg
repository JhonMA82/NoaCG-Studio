<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120">
  <!-- Northbridge Community Broadcasting - SYNTHETIC brand mark for the NoaCG video stinger
       corpus (invented organisation, no real marks used). The LONG-NAME class of the
       five-mark brand-swap set: a two-part lockup, a bridge glyph left of a single long
       name line plus a fine-print kicker, in light ink for a dark surface.
       Aspect 7.5:1 - by far the widest mark in the set, and the one that breaks any slot
       sized around a monogram. Explicit width/height so probeMark reads a natural size. -->

  <!-- The bridge glyph: two piers, a deck, a suspended arch. -->
  <g stroke="#F2F5F8" fill="none" stroke-width="7" stroke-linecap="square">
    <path d="M10 94 H114" />
    <path d="M30 94 V32 M94 94 V32" />
    <path d="M30 44 C50 76 74 76 94 44" />
    <path d="M10 32 H30 M94 32 H114" stroke-width="4" />
  </g>
  <!-- The deck shadow, one tone down: the mark's only secondary ink. -->
  <path d="M10 102 H114" stroke="#8FA3B8" stroke-width="4" stroke-linecap="square" />
  <!-- The lockup divider. -->
  <rect x="140" y="22" width="3" height="76" fill="#8FA3B8" />

  <!-- The name. Set in a generic grotesque stack on purpose: this mark's job in the set is
       to be LONG, and real text is the honest way to be long. -->
  <text x="170" y="62" fill="#F2F5F8"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="0.5">NORTHBRIDGE COMMUNITY BROADCASTING</text>
  <text x="172" y="92" fill="#8FA3B8"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" letter-spacing="4.6">PUBLIC SERVICE MEDIA SINCE 1974</text>
</svg>
