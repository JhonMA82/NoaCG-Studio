<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Volt Decision</title>

  <!-- GSAP animation library (bundled locally — no internet needed at playout). -->
  <script src="js/gsap.min.js"></script>

  <!-- Template styles and logic. -->
  <link rel="stylesheet" href="css/template.css" />
  <script src="js/template.js"></script>

  <!-- SPX template definition: the data fields shown to the operator. -->
  <script id="spx-template-definition" type="text/javascript">
window.SPXGCTemplateDefinition = {
    "description": "Volt Decision",
    "playserver": "OVERLAY",
    "playchannel": "1",
    "playlayer": "7",
    "webplayout": "7",
    "out": "manual",
    "steps": "1",
    "dataformat": "json",
    "uicolor": "4",
    "DataFields": [
        {
            "field": "f0",
            "ftype": "textfield",
            "title": "Name",
            "value": "Ingrid Bakker"
        },
        {
            "field": "f1",
            "ftype": "textfield",
            "title": "Role",
            "value": "Polling Analyst"
        },
        {
            "field": "f2",
            "ftype": "filelist",
            "title": "Logo",
            "value": "images/kestrel-athletic.svg",
            "assetfolder": "./images/",
            "extension": "png"
        }
    ]
};
</script>
</head>
<body>
  <!-- Lower third. Hidden until play(); positioned by the .lower-third rule in the CSS. -->
  <div class="lower-third">
    <!-- Volt Decision: the platform's lower-third structure - a bar fused to the panel's leading edge, outside its padding.
         Structure and spacing are platform-owned; the design language decides how it reads. -->
    <!-- The accent: a bar fused to the panel's leading edge, outside its padding. -->
    <div class="lower-third-accent"></div>
    <div class="lower-third-box">
      <!-- Everything the design draws, kept together so the mark sits beside the whole stack. -->
      <div class="lower-third-lockup">
        <!-- Name (f0) — SPX writes this field's value straight into the element. -->
        <div class="lower-third-mask"><span id="f0" class="lower-third-name">Ingrid Bakker</span></div>
        <!-- Role (f1) — SPX writes this field's value straight into the element. -->
        <div class="lower-third-mask"><span id="f1" class="lower-third-title">Polling Analyst</span></div>
      </div>
      <!-- Logo (image field f2) — sits beside the stack above, centred on it. Empty = hidden. -->
      <img id="f2" class="lower-third-logo" src="images/kestrel-athletic.svg" alt="" />
    </div>
  </div>
</body>
</html>
