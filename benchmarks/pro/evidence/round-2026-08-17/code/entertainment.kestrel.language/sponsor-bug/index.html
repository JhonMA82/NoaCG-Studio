<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kestrel Prime Matchday</title>

  <!-- GSAP animation library (bundled locally — no internet needed at playout). -->
  <script src="js/gsap.min.js"></script>

  <!-- Template styles and logic. -->
  <link rel="stylesheet" href="css/template.css" />
  <script src="js/template.js"></script>

  <!-- SPX template definition: the data fields shown to the operator. -->
  <script id="spx-template-definition" type="text/javascript">
window.SPXGCTemplateDefinition = {
    "description": "Kestrel Prime Matchday",
    "playserver": "OVERLAY",
    "playchannel": "1",
    "playlayer": "7",
    "webplayout": "7",
    "out": "manual",
    "steps": "1",
    "dataformat": "json",
    "uicolor": "4",
    "DataFields": [
        {
            "field": "f0",
            "ftype": "textfield",
            "title": "Caption",
            "value": "Kestrel Athletic"
        },
        {
            "field": "f1",
            "ftype": "filelist",
            "title": "Logo",
            "value": "images/kestrel-athletic.svg",
            "assetfolder": "./images/",
            "extension": "png"
        }
    ]
};
</script>
</head>
<body>
  <!-- Corner bug — a persistent on-air logo mark. -->
  <div class="corner-bug">
    <!-- Kestrel Prime Matchday: the platform's sponsor-bug structure - a bar fused to the panel's leading edge, outside its padding.
         The mark leads the tile (the shared slot's band arrangement); the caption is the
         package's label voice. Structure and spacing are platform-owned. -->
      <!-- The accent: a bar fused to the panel's leading edge, outside its padding. -->
      <div class="corner-bug-accent"></div>
    <div class="corner-bug-box">
      <!-- Logo (image field f1) — a band above the text. Empty = hidden. -->
      <img id="f1" class="corner-bug-logo" src="images/kestrel-athletic.svg" alt="" />
      <!-- Caption (f0) — SPX writes this field's value straight into the element. -->
      <div class="corner-bug-mask"><span id="f0" class="corner-bug-name">Kestrel Athletic</span></div>
    </div>
  </div>
</body>
</html>
