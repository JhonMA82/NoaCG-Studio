<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kestrel Kickoff</title>

  <!-- GSAP animation library (bundled locally — no internet needed at playout). -->
  <script src="js/gsap.min.js"></script>

  <!-- Template styles and logic. -->
  <link rel="stylesheet" href="css/template.css" />
  <script src="js/template.js"></script>

  <!-- SPX template definition: the data fields shown to the operator. -->
  <script id="spx-template-definition" type="text/javascript">
window.SPXGCTemplateDefinition = {
    "description": "Kestrel Kickoff",
    "playserver": "OVERLAY",
    "playchannel": "1",
    "playlayer": "7",
    "webplayout": "7",
    "out": "manual",
    "steps": "1",
    "dataformat": "json",
    "uicolor": "4",
    "DataFields": [
        {
            "field": "f0",
            "ftype": "textfield",
            "title": "Topic",
            "value": "The Story in Numbers"
        },
        {
            "field": "f1",
            "ftype": "textfield",
            "title": "Context",
            "value": "Renewables grew 28% this year"
        },
        {
            "field": "f2",
            "ftype": "textfield",
            "title": "Detail",
            "value": "Coal at its lowest share since 1965"
        },
        {
            "field": "f3",
            "ftype": "filelist",
            "title": "Logo",
            "value": "images/kestrel-athletic.svg",
            "assetfolder": "./images/",
            "extension": "png"
        }
    ]
};
</script>
</head>
<body>
  <!-- Info card. Hidden until play(); positioned by the .info-card rule in the CSS. -->
  <div class="info-card">
    <!-- Kestrel Kickoff: the platform's topic-card structure - a bar fused to the panel's leading edge, outside its padding.
         The card that stays up during the discussion; structure and spacing are platform-owned. -->
    <!-- The accent: a bar fused to the panel's leading edge, outside its padding. -->
    <div class="info-card-accent"></div>
    <div class="info-card-box">
      <!-- Logo (image field f3) — a band above the text. Empty = hidden. -->
      <img id="f3" class="info-card-logo" src="images/kestrel-athletic.svg" alt="" />
      <!-- Topic (f0) — SPX writes this field's value straight into the element. -->
      <div class="info-card-mask"><span id="f0" class="info-card-name">The Story in Numbers</span></div>
      <!-- Context (f1) — SPX writes this field's value straight into the element. -->
      <div class="info-card-mask"><span id="f1" class="info-card-title">Renewables grew 28% this year</span></div>
      <!-- Detail (f2) — SPX writes this field's value straight into the element. -->
      <div class="info-card-mask"><span id="f2" class="info-card-extra">Coal at its lowest share since 1965</span></div>
    </div>
  </div>
</body>
</html>
