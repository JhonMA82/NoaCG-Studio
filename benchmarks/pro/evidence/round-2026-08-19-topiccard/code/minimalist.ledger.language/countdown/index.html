<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ledger Investigations</title>

  <!-- GSAP animation library (bundled locally — no internet needed at playout). -->
  <script src="js/gsap.min.js"></script>

  <!-- Template styles and logic. -->
  <link rel="stylesheet" href="css/template.css" />
  <script src="js/template.js"></script>

  <!-- SPX template definition: the data fields shown to the operator. -->
  <script id="spx-template-definition" type="text/javascript">
window.SPXGCTemplateDefinition = {
    "description": "Ledger Investigations",
    "playserver": "OVERLAY",
    "playchannel": "1",
    "playlayer": "7",
    "webplayout": "7",
    "out": "manual",
    "steps": "1",
    "dataformat": "json",
    "uicolor": "4",
    "DataFields": [
        {
            "field": "f0",
            "ftype": "textfield",
            "title": "Label",
            "value": "STARTING IN"
        },
        {
            "field": "f1",
            "ftype": "number",
            "title": "Timer (minutes)",
            "value": "3"
        }
    ]
};
</script>
</head>
<body>
  <!-- Ledger Investigations. The clock text is painted by the countdown runtime (M:SS). -->
  <div class="game-timer">
    <!-- Ledger Investigations: the platform's countdown structure - a rule under the words, one clear space below them.
         The label is the package's label voice; the clock is its primary size. The countdown
         runtime repaints the clock every second as M:SS and adds .game-timer-done at zero. -->
    <div class="game-timer-box">
      <!-- The label line — #f0 is the SPX field. -->
      <div class="game-timer-mask"><span id="f0" class="game-timer-label">STARTING IN</span></div>
      <!-- The clock — the countdown runtime repaints this every second. -->
      <div class="game-timer-clock">3:00</div>
      <!-- The accent: a rule under the words, one clear space below them. -->
      <div class="game-timer-accent"></div>
    </div>
    <!-- Hidden duration source — SPX writes field f1 (minutes) here; JS reads it. -->
    <div id="f1" class="noacg-data-source">3</div>
  </div>
</body>
</html>
