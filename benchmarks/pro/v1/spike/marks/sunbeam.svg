<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Sunbeam - SYNTHETIC brand mark for the NoaCG Pro brand round (invented organisation).
       A bright consumer roundel: orange disc, cream spokes, honey core. The disc does not
       reach the corners, so the backing reads transparent; the ink is warm and light. -->
  <circle cx="60" cy="60" r="56" fill="#FF7A1A" />
  <g fill="#FFFDF6">
    <g transform="rotate(0 60 60)"><rect x="57" y="12" width="6" height="18" rx="3" /></g>
    <g transform="rotate(45 60 60)"><rect x="57" y="12" width="6" height="18" rx="3" /></g>
    <g transform="rotate(90 60 60)"><rect x="57" y="12" width="6" height="18" rx="3" /></g>
    <g transform="rotate(135 60 60)"><rect x="57" y="12" width="6" height="18" rx="3" /></g>
    <g transform="rotate(180 60 60)"><rect x="57" y="12" width="6" height="18" rx="3" /></g>
    <g transform="rotate(225 60 60)"><rect x="57" y="12" width="6" height="18" rx="3" /></g>
    <g transform="rotate(270 60 60)"><rect x="57" y="12" width="6" height="18" rx="3" /></g>
    <g transform="rotate(315 60 60)"><rect x="57" y="12" width="6" height="18" rx="3" /></g>
  </g>
  <circle cx="60" cy="60" r="26" fill="#FFC838" />
  <circle cx="60" cy="60" r="26" fill="none" stroke="#FFFDF6" stroke-width="4" />
</svg>
