<svg xmlns="http://www.w3.org/2000/svg" width="96" height="120" viewBox="0 0 96 120">
  <!-- The Ledger - SYNTHETIC brand mark for the NoaCG Pro brand round (invented newsroom).
       A monochrome editorial mark: a full-bleed ink slab with knocked-out column rules - a
       masthead reduced to its grid. The slab covers the whole canvas, so probeMark reads
       own-field: this mark brings its own surface and can sit on anything. Portrait 0.8:1. -->
  <rect x="0" y="0" width="96" height="120" fill="#111111" />
  <g fill="#FAFAF8">
    <rect x="14" y="16" width="68" height="10" />
    <rect x="14" y="38" width="68" height="4" />
    <rect x="14" y="50" width="68" height="4" />
    <rect x="14" y="62" width="42" height="4" />
    <rect x="14" y="78" width="28" height="26" />
    <rect x="50" y="78" width="32" height="4" />
    <rect x="50" y="90" width="32" height="4" />
    <rect x="50" y="102" width="24" height="2" />
  </g>
</svg>
