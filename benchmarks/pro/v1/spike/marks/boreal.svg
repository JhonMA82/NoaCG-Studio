<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <!-- Boreal - SYNTHETIC brand mark for the custom-lane type sweep (invented nature and
       science documentary network, no real marks used). A single-ink DARK wordmark: three
       pine silhouettes over a wide baseline rule with "BOREAL" letterform bars - a dark ink
       (deep pine) on transparent backing, so a dark panel forces the knock rule to recolour
       its one ink. Wordmark aspect 2.5:1. -->
  <g fill="#0E2A23">
    <path d="M30 12 L48 52 L38 52 L54 84 L6 84 L22 52 L12 52 Z" />
    <path d="M78 26 L92 56 L84 56 L96 84 L60 84 L72 56 L64 56 Z" />
    <rect x="6" y="92" width="288" height="8" />
    <!-- letterform bars standing in for the wordmark BOREAL -->
    <rect x="112" y="30" width="14" height="54" />
    <rect x="134" y="44" width="14" height="40" />
    <rect x="156" y="30" width="14" height="54" />
    <rect x="178" y="44" width="14" height="40" />
    <rect x="200" y="30" width="14" height="54" />
    <rect x="222" y="44" width="14" height="40" />
    <rect x="244" y="30" width="14" height="54" />
    <rect x="266" y="44" width="14" height="40" />
  </g>
</svg>
