<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- The Aldervale Institute - SYNTHETIC brand mark for the NoaCG Pro brand round (invented
       organisation). A quiet institutional monogram: an "A" with a crossbar serif inside a
       thin double ring. Transparent backing, deep navy ink (dark - needs a light surface). -->
  <g stroke="#14264A" fill="none">
    <circle cx="60" cy="60" r="55" stroke-width="4" />
    <circle cx="60" cy="60" r="47" stroke-width="1.5" />
    <!-- The A -->
    <path d="M38 86 L60 30 L82 86" stroke-width="7" stroke-linecap="square" />
    <path d="M45 66 H75" stroke-width="5" />
    <!-- Baseline serifs -->
    <path d="M32 86 H46 M74 86 H88" stroke-width="4" />
  </g>
</svg>
