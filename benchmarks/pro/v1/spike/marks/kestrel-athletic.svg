<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120">
  <!-- Kestrel Athletic - SYNTHETIC brand mark for the NoaCG Pro brand round (invented
       organisation, no real marks used). A heavy forward-leaning athletic wordmark:
       stroke-skeleton letterforms "KSTRL" with a speed bar. Transparent backing, volt ink.
       Explicit width/height so probeMark reads a natural size (aspect ~4.17 = wordmark). -->
  <g transform="skewX(-10) translate(30 0)" stroke="#C8F531" stroke-width="14" stroke-linecap="square" fill="none">
    <!-- K -->
    <path d="M10 18 V86 M10 56 L52 18 M28 42 L54 86" />
    <!-- S -->
    <path d="M140 26 C108 12 96 40 122 52 C148 64 140 94 104 80" />
    <!-- T -->
    <path d="M180 18 H244 M212 18 V86" />
    <!-- R -->
    <path d="M280 86 V18 H316 C340 18 340 52 316 52 H280 M312 52 L342 86" />
    <!-- L -->
    <path d="M380 18 V86 H432" />
  </g>
  <!-- The speed bar under the letterforms -->
  <path d="M22 102 H330 L318 114 H10 Z" fill="#C8F531" />
</svg>
