<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Floorball Scorebug</title>
  <script src="js/gsap.min.js"></script>
  <link rel="stylesheet" href="css/template.css" />
  <script src="js/template.js"></script>
  <script id="spx-template-definition" type="text/javascript">
window.SPXGCTemplateDefinition = {
    "description": "Floorball Scorebug",
    "playserver": "OVERLAY",
    "playchannel": "1",
    "playlayer": "7",
    "webplayout": "7",
    "out": "manual",
    "steps": "1",
    "dataformat": "json",
    "uicolor": "5",
    "DataFields": [
        { "field": "f0", "ftype": "textfield", "title": "Home Team", "value": "HOME" },
        { "field": "f1", "ftype": "number", "title": "Score Home", "value": "0" },
        { "field": "f2", "ftype": "textfield", "title": "Away Team", "value": "AWAY" },
        { "field": "f3", "ftype": "number", "title": "Score Away", "value": "0" },
        { "field": "f4", "ftype": "number", "title": "Clock - Seconds", "value": "0", "data-start": "0" },
        { "field": "f5", "ftype": "textfield", "title": "Period", "value": "P1" }
    ]
};
</script>
</head>
<body>
  <div class="scoreboard">
    <div class="scoreboard-box">
      <div class="scoreboard-accent"></div>
      <!-- Team A (home) -->
      <div class="scoreboard-group">
        <div class="scoreboard-mask scoreboard-team-mask"><span id="f0" class="scoreboard-team">HOME</span></div>
        <div class="scoreboard-chip">
          <div class="scoreboard-mask"><span id="f1" class="scoreboard-score">0</span></div>
        </div>
      </div>
      <!-- Divider -->
      <div class="scoreboard-divider">|</div>
      <!-- Team B (away) -->
      <div class="scoreboard-group scoreboard-group-b">
        <div class="scoreboard-mask scoreboard-team-mask"><span id="f2" class="scoreboard-team">AWAY</span></div>
        <div class="scoreboard-chip">
          <div class="scoreboard-mask"><span id="f3" class="scoreboard-score">0</span></div>
        </div>
      </div>
      <!-- Clock and Period row -->
      <div class="scoreboard-row">
        <div class="scoreboard-row-mask scoreboard-time-mask"><span id="f4" class="scoreboard-time">00:00</span></div>
        <div class="scoreboard-divider">|</div>
        <div class="scoreboard-row-mask scoreboard-period-mask"><span id="f5" class="scoreboard-period">P1</span></div>
      </div>
    </div>
  </div>
</body>
</html>
