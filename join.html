<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The public AUDIENCE page (docs/INTERACTIVE_PLAYOUT_PLAN.md, Phase 5): the one surface a
         viewer ever sees. Reached only by its capability URL — /join/<name> or /join?p=<slug>,
         and ?pv=<slug> for the presenter's own read-only view. Vanilla TS, no React, the
         Supabase client code-split: this is a phone on venue wifi, so the page ships the
         smallest thing that can do the job (the /output pattern). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Not a page worth indexing: it is a capability, and a search result for one would hand
         the room's join link to people who are not in the room. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>Join</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0b0d;
        color: #f4f4f5;
        /* A phone keyboard opening must not bounce the page around under a thumb. */
        -webkit-text-size-adjust: 100%;
      }
    </style>
  </head>
  <body>
    <main id="join"></main>
    <script type="module" src="/src/join/main.ts"></script>
  </body>
</html>
